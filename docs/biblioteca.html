{padding:2px 6px;border:0;background:transparent;color:#f85149}.taghint{font-size:.72rem;color:var(--mut);margin:-5px 0 8px}.tagchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:-4px;margin-bottom:8px}.tagchip{font-size:.68rem;color:#79c0ff;border:1px solid #1f6feb;border-radius:999px;padding:2px 6px;background:#0d1b2a}@media(max-width:900px){.library{grid-template-columns:1fr;height:auto}.pane{height:60vh}.reader.open{grid-template-columns:1fr}.reading{height:52vh}.sheet{height:48vh}.quote-entry{grid-template-columns:100px 65px 1fr 38px}}

<script>
let A=[],R=[],F={},selected=null;const KEY='scrapeador_fichas_maestro_v3',$=x=>document.getElementById(x);function norm(v){return(v||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function esc(v){return(v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(v){return esc(v).replace(/"/g,'&quot;')}function id(a){return a.record_id||a.doi||norm(a.title)}
async function loadMaster(){try{F=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){F={}};try{let root=await navigator.storage.getDirectory(),h=await root.getFileHandle('fichas_lectura.json');let file=await h.getFile(),txt=await file.text();if(txt.trim()){let disk=JSON.parse(txt);F={...disk,...F}}}catch(e){}localStorage.setItem(KEY,JSON.stringify(F))}
async function saveMaster(){localStorage.setItem(KEY,JSON.stringify(F));try{let root=await navigator.storage.getDirectory(),h=await root.getFileHandle('fichas_lectura.json',{create:true}),w=await h.createWritable();await w.write(JSON.stringify(F,null,2));await w.close()}catch(e){}}
async function init(){A=await fetch('library_articles.json',{cache:'no-store'}).then(x=>x.json());R=await fetch('report_history.json',{cache:'no-store'}).then(x=>x.json());await loadMaster();[...new Set(A.map(x=>x.year).filter(Boolean))].sort().reverse().forEach(y=>$('year').insertAdjacentHTML('beforeend',`<option>${esc(y)}</option>`));renderReports();filter()}
function state(a){return(F[id(a)]||{}).estado||'Pendiente'}function textBadge(a){if(a.text_status==='ok')return '<span class="pill ok">Texto copiable detectado</span>';if(a.text_status)return '<span class="pill no">Sin texto detectable / revisar OCR</span>';return '<span class="pill">Sin verificación de texto</span>'}
function filter(){let q=norm($('q').value),y=$('year').value,st=$('state').value,x=A.filter(a=>(!q||norm([a.title,a.authors,a.abstract,a.keywords,a.doi,a.origin,a.source].join(' ')).includes(q))&&(!y||a.year===y)&&(!st||state(a)===st));$('count').textContent=x.length.toLocaleString()+' resultados';$('articles').innerHTML='';x.slice(0,700).forEach(a=>{let d=document.createElement('div');d.className='art';d.innerHTML=`<div class="title">${esc(a.title)}</div><div class="meta">${esc(a.authors)} · ${esc(a.year)} · ${esc(a.origin||a.source)}</div><span class="pill">${esc(state(a))}</span>${textBadge(a)}`;d.onclick=()=>openReader(a);$('articles').appendChild(d)})}
function renderReports(){$('reports').innerHTML='';R.slice().reverse().forEach(r=>{let d=document.createElement('div');d.className='report';d.innerHTML=`<div class="report-date">${esc(r.date.split('-').reverse().join('/'))}</div><div class="title">Informe de actualización bibliográfica</div><div class="meta">${r.new} incorporaciones · base acumulada ${r.base}</div><div class="meta">${esc(r.sources)}</div>`;d.onclick=()=>openReport(r);$('reports').appendChild(d)})}
function openReport(r){let items=A.filter(a=>(a.first_seen_date||'').startsWith(r.date));$('rt').textContent='Informe · '+r.date.split('-').reverse().join('/');$('rm').textContent=`${r.new} incorporaciones · base ${r.base} · ${r.sources}`;$('rb').innerHTML=`<p class="meta">Se muestran ${items.length} registros identificados en la base para esta corrida.</p>`+items.map((a,i)=>`<div class="report-paper"><div class="title">${i+1}. ${esc(a.title)}</div><div class="meta">${esc(a.authors)} · ${esc(a.year)} · ${esc(a.origin||a.source)}</div>${textBadge(a)}<br><button class="primary" onclick='readById(${JSON.stringify(id(a))})'>Leer y fichar</button></div>`).join('');$('reportOverlay').classList.add('open')}
function closeReport(){$('reportOverlay').classList.remove('open')}function readById(i){let a=A.find(x=>id(x)===i);if(a){closeReport();openReader(a)}}
function apaAuto(a){let au=(a.authors||'').split(';').map(x=>x.trim()).filter(Boolean);let author=au.length?au.join(', '):'Autor/a';return `${author} (${a.year||'s. f.'}). ${a.title}. ${a.origin||a.source||''}${a.doi?'. https://doi.org/'+a.doi:''}`}
function viewerUrl(a){if(a.drive_file_id)return `https://drive.google.com/file/d/${encodeURIComponent(a.drive_file_id)}/preview`;let u=a.pdf_url||a.url;if(!u)return '';if(/\.pdf($|\?)/i.test(u)||a.pdf_url)return `https://docs.google.com/gview?embedded=1&url=${encodeURIComponent(u)}`;return u}
function openReader(a){selected=a;let f=F[id(a)]||{};$('readTitle').textContent=a.title;$('readMeta').textContent=`${a.authors||''} · ${a.year||''}${a.pages?' · '+a.pages+' págs.':''}`;if(a.text_status==='ok')$('textCheck').innerHTML='<div class="textcheck ok">✓ Capa de texto detectada: debería permitir seleccionar y copiar citas.</div>';else if(a.text_status)$('textCheck').innerHTML='<div class="textcheck no">⚠ No se detectó texto extraíble. El PDF puede requerir OCR para copiar citas.</div>';else $('textCheck').innerHTML='<div class="textcheck no">? Este PDF todavía no fue verificado por el extractor de texto.</div>';let src=viewerUrl(a);$('viewer').innerHTML=src?`<iframe src="${attr(src)}" allow="clipboard-read; clipboard-write"></iframe>`:`<div class="fallback"><h2>${esc(a.title)}</h2><p>${esc(a.abstract||'No hay PDF disponible para lectura interna.')}</p></div>`;let val=(k,d='')=>f[k]!==undefined?f[k]:d;let quotes=Array.isArray(f.citas_lista)?f.citas_lista:[];$('sheet').innerHTML=`<h2>Metadatos</h2><div class="g2">${inp('titulo','Título',val('titulo',a.title))}${inp('anio','Año',val('anio',a.year))}</div>${inp('autores','Autores',val('autores',a.authors))}${inp('apa','Cita / referencia APA preliminar (editable)',val('apa',apaAuto(a)))}<div class="g2">${inp('doi','DOI',val('doi',a.doi))}${inp('fuente','Fuente / revista',val('fuente',a.origin||a.source))}</div>
<h2>1. Citas literales</h2><div class="quote-entry"><div class="form"><label>Etiqueta</label><input id="qtag" placeholder="ej. regulación"></div><div class="form"><label>Página</label><input id="qpage" placeholder="p. 12"></div><div class="form"><label>Cita literal</label><textarea id="qtext" placeholder="Pegá aquí la cita textual..."></textarea></div><button class="primary plus" title="Guardar cita y agregar otra" onclick="addQuote()">+</button></div><div class="quotes" id="quotes"></div>
<h2>2. Lectura y análisis</h2><div class="taghint">En estos campos podés escribir etiquetas dentro del texto usando @, por ejemplo: @regulación @afectos @responsabilización.</div><div class="g2">${sel('estado','Estado',['Pendiente','Por leer','Leyendo','Leído','Fichado','Usado'],val('estado','Leyendo'))}${sel('relevancia','Relevancia',['','Central','Alta','Media','Contextual','Descartar'],val('relevancia'))}</div>${inp('tipo_uso','Tipo de uso',val('tipo_uso'),'antecedente, marco conceptual, metodología, evidencia, discusión')}${ta('problema','Problema / pregunta del texto',val('problema'))}${ta('objetivo','Objetivo',val('objetivo'))}${ta('marco','Marco conceptual / conceptos',val('marco'))}${ta('metodo','Metodología / corpus',val('metodo'))}${ta('hallazgos','Hallazgos principales',val('hallazgos'))}${ta('aporte','Aporte para mi investigación',val('aporte'))}${ta('discusion','Discusión propia / desacuerdos',val('discusion'))}${ta('relaciones','Relaciones con otros textos / autores',val('relaciones'))}${inp('proyecto','Dónde podría usarlo / proyecto',val('proyecto'))}${inp('tags','Etiquetas generales',val('tags'),'regulación, afectos, dirección escolar...')}${ta('notas','Notas libres',val('notas'))}<div id="inlineTags" class="tagchips"></div><div class="actions"><button onclick="window.print()">Guardar ficha como PDF</button></div><div class="autosave" id="autosave">✓ Guardado automático activo · archivo maestro único</div>`;$('sheet').querySelectorAll('[data-k]').forEach(e=>{e.addEventListener('input',()=>{refreshTags();autosave()});e.addEventListener('change',autosave)});F[id(a)]={...f,citas_lista:quotes};renderQuotes();refreshTags();autosave();$('reader').classList.add('open')}
function inp(k,l,v,p=''){return`<div class="form"><label>${l}</label><input data-k="${k}" value="${attr(v||'')}" placeholder="${attr(p)}"></div>`}function ta(k,l,v){return`<div class="form"><label>${l}</label><textarea data-k="${k}">${esc(v||'')}</textarea></div>`}function sel(k,l,opts,v){return`<div class="form"><label>${l}</label><select data-k="${k}">${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function addQuote(){if(!selected)return;let tag=$('qtag').value.trim(),page=$('qpage').value.trim(),text=$('qtext').value.trim();if(!text)return;$('qtext').focus();let f=F[id(selected)]||{},arr=Array.isArray(f.citas_lista)?f.citas_lista:[];arr.push({tag,page,text,created_at:new Date().toISOString()});f.citas_lista=arr;F[id(selected)]=f;$('qtag').value='';$('qpage').value='';$('qtext').value='';renderQuotes();autosave();$('qtag').focus()}
function renderQuotes(){if(!selected||!$('quotes'))return;let arr=(F[id(selected)]||{}).citas_lista||[];$('quotes').innerHTML=arr.map((q,i)=>`<div class="quote-card"><div class="qtag">${q.tag?'#'+esc(q.tag):'—'}</div><div class="qpage">${esc(q.page||'—')}</div><div class="qtext">${esc(q.text)}</div><button class="qdel" onclick="deleteQuote(${i})" title="Eliminar">×</button></div>`).join('')}
function deleteQuote(i){let f=F[id(selected)]||{},arr=f.citas_lista||[];arr.splice(i,1);f.citas_lista=arr;F[id(selected)]=f;renderQuotes();autosave()}
function collectInlineTags(){let tags=new Set();$('sheet').querySelectorAll('[data-k]').forEach(e=>{let m=e.value.match(/@[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9_-]+/g)||[];m.forEach(x=>tags.add(x))});return [...tags]}
function refreshTags(){if(!selected||!$('inlineTags'))return;let tags=collectInlineTags();$('inlineTags').innerHTML=tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('');let f=F[id(selected)]||{};f.inline_tags=tags;F[id(selected)]=f}
let timer;function autosave(){if(!selected)return;let f={...(F[id(selected)]||{})};$('sheet').querySelectorAll('[data-k]').forEach(e=>f[e.dataset.k]=e.value);f.inline_tags=collectInlineTags();f.updated_at=new Date().toISOString();F[id(selected)]=f;let x=$('autosave');if(x){x.textContent='Guardando…';clearTimeout(timer);timer=setTimeout(async()=>{await saveMaster();x.textContent='✓ Guardado automáticamente · fichas acumuladas: '+Object.keys(F).length},300)}filter()}
function closeReader(){autosave();$('reader').classList.remove('open');selected=null}function externalOpen(){if(selected&&(selected.drive_file_id||selected.pdf_url||selected.url)){let u=selected.drive_file_id?`https://drive.google.com/file/d/${selected.drive_file_id}/view`:selected.pdf_url||selected.url;window.open(u,'_blank')}}
function exportAll(){let blob=new Blob([JSON.stringify(F,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='fichas_lectura.json';a.click();URL.revokeObjectURL(u)}$('q').oninput=filter;$('year').onchange=filter;$('state').onchange=filter;init();
</script>
<script>
(function(){
  if (window.__libraryOCRInstalled) return;
  window.__libraryOCRInstalled = true;
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }

  const OCR_LANGS = {
    spa: {label:'Español', words:[' el ',' la ',' los ',' las ',' de ',' que ',' para ',' una ',' dirección ',' escuela ',' educación ',' escolar ',' desigualdad ',' docente ']},
    eng: {label:'Inglés', words:[' the ',' of ',' and ',' to ',' in ',' school ',' education ',' leadership ',' teachers ',' students ',' policy ']},
    por: {label:'Portugués', words:[' de ',' que ',' para ',' uma ',' escola ',' educação ',' gestão ',' professores ',' alunos ',' ensino ']}
  };

  function inferOCRLanguage(a){
    const raw = (' ' + ((a&&a.title)||'') + ' ' + ((a&&a.abstract)||'') + ' ' + ((a&&a.keywords)||'') + ' ').toLowerCase();
    const scores = {};
    for (const [code,info] of Object.entries(OCR_LANGS)) {
      scores[code] = info.words.reduce((n,w)=>n + (raw.split(w).length-1),0);
    }
    // Acentos distintivos como apoyo cuando hay pocos metadatos.
    scores.spa += (raw.match(/[ñ¿¡]/g)||[]).length * 2;
    scores.por += (raw.match(/[ãõç]/g)||[]).length * 2;
    scores.eng += (raw.match(/\b(the|with|from|between|through)\b/g)||[]).length;
    let code = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    if (Math.max(...Object.values(scores)) === 0) code = 'spa';
    return {code, label:OCR_LANGS[code].label, scores};
  }

  function setOCRStatus(msg, cls=''){
    const box = document.getElementById('textCheck');
    if (!box) return;
    box.innerHTML = '<div class="textcheck '+cls+'">'+msg+'</div>';
  }

  function showOCRText(text, langLabel){
    const viewer = document.getElementById('viewer');
    if (!viewer) return;
    viewer.innerHTML = '<div class="fallback" style="white-space:pre-wrap;font-family:Georgia,serif;line-height:1.55"><div style="position:sticky;top:0;background:white;padding:6px 0 10px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;color:#555"><b>Texto OCR · '+langLabel+'</b> · seleccionable y copiable · los separadores indican la página</div>'+escapeOCR(text)+'</div>';
  }

  function escapeOCR(v){
    return (v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  }

  async function getPdfSource(a){
    if (!a) throw new Error('No hay artículo seleccionado.');
    const src = a.pdf_url || a.url;
    if (!src) throw new Error('Este registro no tiene URL de PDF disponible.');
    return src;
  }

  async function inspectNativeText(pdf, maxPages=3){
    let chars=0, pages=0;
    for (let n=1;n<=Math.min(pdf.numPages,maxPages);n++){
      const page=await pdf.getPage(n);
      const tc=await page.getTextContent();
      const txt=(tc.items||[]).map(i=>i.str||'').join(' ').trim();
      chars += txt.length; pages++;
    }
    return {chars,pages,avg:pages?chars/pages:0,hasText:pages ? chars/pages >= 120 : false};
  }

  async function extractNativeText(pdf){
    const chunks=[];
    for(let n=1;n<=pdf.numPages;n++){
      setOCRStatus('Extrayendo texto existente · página '+n+' de '+pdf.numPages+'…','ok');
      const page=await pdf.getPage(n);
      const tc=await page.getTextContent();
      const txt=(tc.items||[]).map(i=>i.str||'').join(' ').trim();
      chunks.push('\\n\\n===== PÁGINA '+n+' =====\\n\\n'+txt);
    }
    return chunks.join('');
  }

  async function runOCR(pdf, lang){
    const chunks=[];
    const worker = await Tesseract.createWorker(lang, 1, {
      logger: m => {
        if (m && m.status === 'recognizing text' && typeof m.progress === 'number') {
          const pct=Math.round(m.progress*100);
          setOCRStatus('OCR '+OCR_LANGS[lang].label+' · '+pct+'% de la página actual…','');
        }
      }
    });
    try {
      for(let n=1;n<=pdf.numPages;n++){
        setOCRStatus('OCR '+OCR_LANGS[lang].label+' · página '+n+' de '+pdf.numPages+'…','');
        const page=await pdf.getPage(n);
        const viewport=page.getViewport({scale:1.65});
        const canvas=document.createElement('canvas');
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
        await page.render({canvasContext:ctx,viewport}).promise;
        const ret=await worker.recognize(canvas);
        const txt=((ret&&ret.data&&ret.data.text)||'').trim();
        chunks.push('\\n\\n===== PÁGINA '+n+' =====\\n\\n'+txt);
        canvas.width=1; canvas.height=1;
      }
    } finally {
      await worker.terminate();
    }
    return chunks.join('');
  }

  window.reviewOCR = async function(){
    if (!window.selected) {
      setOCRStatus('No hay artículo seleccionado.','no'); return;
    }
    const btn=document.getElementById('ocrBtn');
    if(btn){btn.disabled=true;btn.textContent='Revisando OCR…';}
    try{
      if(!window.pdfjsLib || !window.Tesseract) throw new Error('No se pudieron cargar los componentes OCR. Recargá la página.');
      const src=await getPdfSource(window.selected);
      const inferred=inferOCRLanguage(window.selected);
      setOCRStatus('Idioma probable: '+inferred.label+' · verificando capa de texto…','');
      const pdf=await pdfjsLib.getDocument({url:src,withCredentials:false}).promise;
      const native=await inspectNativeText(pdf);
      let text, mode;
      if(native.hasText){
        text=await extractNativeText(pdf);
        mode='texto nativo';
        setOCRStatus('✓ Texto copiable detectado · OCR innecesario · idioma probable: '+inferred.label,'ok');
      }else{
        setOCRStatus('Sin texto suficiente · iniciando OCR en '+inferred.label+'…','no');
        text=await runOCR(pdf,inferred.code);
        mode='ocr';
        setOCRStatus('✓ OCR generado · '+inferred.label+' · '+pdf.numPages+' páginas','ok');
      }
      const fid=(window.id && id(window.selected)) || window.selected.record_id || window.selected.doi || window.selected.title;
      window.F = window.F || {};
      const f={...(F[fid]||{})};
      f.ocr_text=text; f.ocr_language=inferred.code; f.ocr_language_label=inferred.label; f.ocr_mode=mode; f.ocr_pages=pdf.numPages; f.ocr_updated_at=new Date().toISOString();
      F[fid]=f;
      if(typeof saveMaster==='function') await saveMaster();
      showOCRText(text,inferred.label);
    }catch(err){
      console.error(err);
      const msg=(err&&err.message)||String(err);
      setOCRStatus('⚠ No se pudo revisar OCR dentro de la página: '+msg+' Puede deberse a restricciones de acceso/CORS del PDF.','no');
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Revisar / generar OCR';}
    }
  };
})();
</script>

<script>
(function(){
  if(window.__universalReaderInstalled)return; window.__universalReaderInstalled=true;
  const previousOpenReader=window.openReader||openReader;
  const textCache={};
  function e(v){return(v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function articleId(a){return(typeof id==='function')?id(a):(a.record_id||a.doi||a.title)}
  function savedText(a){try{const store=(typeof F!=='undefined')?F:(window.F||{});return(store[articleId(a)]||{}).ocr_text||''}catch(err){return''}}
  async function corpusText(a){
    if(!a.text_file)return'';
    if(textCache[a.text_file]!==undefined)return textCache[a.text_file];
    try{const r=await fetch(a.text_file,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();textCache[a.text_file]=t;return t}catch(err){console.warn('No se pudo cargar texto completo',err);textCache[a.text_file]='';return''}
  }
  function driveUrl(a){return a.drive_preview_url||(a.drive_file_id?'https://drive.google.com/file/d/'+encodeURIComponent(a.drive_file_id)+'/preview':'')}
  function directPdf(a){return a.pdf_url||a.url||''}

  function textBody(a,txt,label){

  }
  function iframe(src){return '<iframe src="'+e(src)+'" style="width:100%;height:100%;border:0;background:#fff" allow="fullscreen; clipboard-read; clipboard-write"></iframe>'}

  function nativePdf(src){
    const embedUrl = 'https://drive.google.com/viewerng/viewer?embedded=true&url=' + encodeURIComponent(src);
    return iframe(embedUrl);
  }

  function pdfBody(a){
    const drive=driveUrl(a),pdf=directPdf(a);
    if(drive){
      const method=a.drive_match_method==='doi_exact'?'DOI exacto':(a.drive_match_method==='strict_title_author_year'?'título + autor + año':'vínculo verificado');
      const fn=a.drive_filename||'archivo de Drive';
      return '<div style="height:100%;display:flex;flex-direction:column;background:#fff">'
        +'<div style="padding:6px 10px;background:#eef7ee;color:#173b17;border-bottom:1px solid #b8d8b8;font:11px Segoe UI,Arial,sans-serif"><b>'+e(fn)+'</b> · '+e(method)+'</div>'
        +'<div style="flex:1;min-height:0">'+iframe(drive)+'</div></div>';
    }

        +'<div style="padding:6px 10px;background:#fff7e6;color:#684b00;border-bottom:1px solid #e6c76b;font:11px Segoe UI,Arial,sans-serif"><b>PDF embebido (Drive ViewerNG)</b> · lectura sin descarga</div>'
        +'<div style="flex:1;min-height:0">'+nativePdf(pdf)+'</div></div>';

    return '<div class="fallback"><h3>No hay PDF disponible</h3><p>Este trabajo puede leerse desde el texto extraído, el resumen o el sitio del artículo.</p></div>';

  async function renderUniversal(a,mode){
    const viewer=document.getElementById('viewer');if(!viewer)return;
    const drive=driveUrl(a),pdf=directPdf(a),site=sourceUrl(a),local=savedText(a),hasCorpus=!!a.text_file,hasAbstract=!!a.abstract,hasPdf=!!(drive||pdf);

      +'<button id="uvRead" type="button" style="padding:5px 9px">'+(local||hasCorpus?'📝 Texto completo':'📝 Resumen / Texto')+'</button>'
      +(site?'<button id="uvSite" type="button" style="padding:5px 9px">🌐 Sitio de la revista</button>':'')
      +'<span style="margin-left:auto;color:#8b949e;font-size:11px">'+(drive?'PDF en Drive':pdf?'Visor embebido (sin descarga)':local||hasCorpus?'texto interno':hasAbstract?'resumen':'fuente externa')+'</span></div>';
    viewer.innerHTML='<div style="height:100%;display:flex;flex-direction:column">'+bar+'<div id="uvBody" style="flex:1;min-height:0"></div></div>';

    else body.innerHTML=abstractBody(a);

    const r=document.getElementById('uvRead');if(r)r.onclick=()=>renderUniversal(a,'read');
    const p=document.getElementById('uvPdf');if(p)p.onclick=()=>renderUniversal(a,'pdf');
    const s=document.getElementById('uvSite');if(s)s.onclick=()=>renderUniversal(a,'site');
  }
  window.renderUniversalReader=renderUniversal;
  window.openReader=openReader=function(a){
    window.selected=a;previousOpenReader(a);
    const hasPdf=!!(driveUrl(a)||directPdf(a));
    renderUniversal(a,hasPdf?'pdf':'read');
    const tc=document.getElementById('textCheck');

      if(hasPdf)tc.innerHTML='<div class="textcheck ok">✓ Visor PDF incrustado. Podés leer el trabajo sin salir de la ficha.</div>';
      else if(savedText(a)||a.text_file)tc.innerHTML='<div class="textcheck ok">✓ Texto completo interno disponible: podés seleccionar y copiar citas.</div>';
      else if(a.abstract)tc.innerHTML='<div class="textcheck no">No hay PDF disponible; se muestra el resumen y el acceso al sitio del artículo.</div>';
      else tc.innerHTML='<div class="textcheck no">No hay PDF ni resumen interno; usá Sitio del artículo.</div>';
    }
  }
})();
</script>


<script>
(function(){
  if(window.__apa7MetadataInstalled) return;
  window.__apa7MetadataInstalled=true;
  const previousOpenReader=window.openReader || openReader;

  // Atajo de teclado ESC para volver a la lista
  document.addEventListener('keydown', function(evt){
    if(evt.key === 'Escape'){
      const reader = document.getElementById('reader');
      const overlay = document.getElementById('reportOverlay');
      if(overlay && overlay.classList.contains('open')){
        closeReport();
      } else if(reader && reader.classList.contains('open')){
        closeReader();
      }
    }
  });

  function q(sel, root=document){return root.querySelector(sel)}
  function qa(sel, root=document){return [...root.querySelectorAll(sel)]}
  function esc(v){return (v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function aid(a){try{return id(a)}catch(e){return a.record_id||a.doi||a.title}}
  function field(k){return q('[data-k="'+k+'"]')}
  function val(k){const el=field(k); return el?el.value.trim():''}
  function setv(k,v){const el=field(k); if(el && !el.value) el.value=v||''}

  function splitAuthors(raw){
    return (raw||'').split(/\s*;\s*|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);
  }
  function initials(given){
    return (given||'').split(/[\s-]+/).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+'.').join(' ');
  }
  function bestAuthor(name){
    name=(name||'').trim(); if(!name) return '';
    if(name.includes(',')){
      let [sur,...rest]=name.split(','); return sur.trim()+', '+initials(rest.join(' ').trim());
    }
    const t=name.split(/\s+/).filter(Boolean); if(t.length===1) return t[0];
    const particles=new Set(['de','del','la','las','los','da','das','do','dos','di','van','von']);
    let start=Math.max(1,t.length-2);
    while(start>1 && particles.has(t[start-1].toLowerCase())) start--;
    if(start>1 && t.slice(start).some(x=>particles.has(x.toLowerCase()))) start--;
    const given=t.slice(0,start).join(' '), sur=t.slice(start).join(' ');
    return sur+', '+initials(given);
  }
  function proposedAuthors(raw){return splitAuthors(raw).map(bestAuthor).join('\n')}
  function apaAuthors(raw){
    let arr=(raw||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(!arr.length) return '';
    if(arr.length===1) return arr[0];
    if(arr.length===2) return arr[0]+', & '+arr[1];
    return arr.slice(0,-1).join(', ')+', & '+arr[arr.length-1];
  }
  function sentenceTitle(s){
    s=(s||'').trim(); if(!s) return '';
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function doiUrl(v){
    v=(v||'').trim(); if(!v) return '';
    v=v.replace(/^https?:\/\/(dx\.)?doi\.org\//i,'');
    return 'https://doi.org/'+v;
  }
  function enddot(s){s=(s||'').trim(); return s && !/[.!?]$/.test(s)?s+'.':s}
  function pagesNorm(v){return (v||'').trim().replace(/^pp?\.\s*/i,'')}

  function apa7(){
    const type=val('tipo_publicacion')||'article';
    const authors=apaAuthors(val('autores_apa')) || val('autores');
    const year=val('anio')||'s. f.';
    const title=sentenceTitle(val('titulo'));
    const doi=doiUrl(val('doi'));
    const url=val('url_biblio');
    let out='';
    if(type==='article'){
      const journal=val('revista'), vol=val('volumen'), num=val('numero'), pages=pagesNorm(val('paginas_biblio'));
      out=`${enddot(authors)} (${year}). ${enddot(title)} ${journal}`;
      if(vol) out+=`, ${vol}`;
      if(num) out+=`(${num})`;
      if(pages) out+=`, ${pages}`;
      out+='.';
      if(doi) out+=' '+doi; else if(url) out+=' '+url;
    } else if(type==='thesis'){
      const degree=val('tipo_tesis')||'Tesis'; const inst=val('institucion'); const repo=val('repositorio');
      out=`${enddot(authors)} (${year}). ${title} [${degree}, ${inst||'Institución'}].`;
      if(repo) out+=` ${repo}.`; if(url||doi) out+=' '+(doi||url);
    } else if(type==='book'){
      const edition=val('edicion'), publisher=val('editorial');
      out=`${enddot(authors)} (${year}). ${title}`;
      if(edition) out+=` (${edition})`;
      out+='.'; if(publisher) out+=` ${publisher}.`; if(doi||url) out+=' '+(doi||url);
    } else if(type==='chapter'){
      const eds=val('editores'), book=val('titulo_libro'), pages=pagesNorm(val('paginas_biblio')), publisher=val('editorial');
      out=`${enddot(authors)} (${year}). ${enddot(title)} En ${eds||'Editor/a'} (Ed.), ${book||'Título del libro'}`;
      if(pages) out+=` (pp. ${pages})`; out+='.'; if(publisher) out+=` ${publisher}.`; if(doi||url) out+=' '+(doi||url);
    } else if(type==='report'){
      const org=val('institucion')||val('editorial'); const n=val('numero_informe');
      out=`${enddot(authors||org)} (${year}). ${title}`;
      if(n) out+=` (Informe n.º ${n})`; out+='.'; if(org && authors!==org) out+=` ${org}.`; if(doi||url) out+=' '+(doi||url);
    }
    return out.replace(/\s+/g,' ').replace(/\s+\./g,'.').trim();
  }

  function row(label,k,placeholder=''){
    return `<div class="form bib-extra"><label>${esc(label)}</label><input data-k="${esc(k)}" placeholder="${esc(placeholder)}"></div>`;
  }
  function area(label,k,placeholder=''){
    return `<div class="form bib-extra"><label>${esc(label)}</label><textarea data-k="${esc(k)}" placeholder="${esc(placeholder)}" style="min-height:58px"></textarea></div>`;
  }
  function dynamicFields(type){
    if(type==='article') return `<div class="g2">${row('Revista / Fuente','revista')}${row('Volumen','volumen')}</div><div class="g2">${row('Número','numero')}${row('Páginas','paginas_biblio','23–41')}</div>`;
    if(type==='thesis') return `<div class="g2">${row('Tipo de tesis','tipo_tesis','Tesis doctoral / Tesis de maestría')}${row('Institución','institucion')}</div><div class="g2">${row('Repositorio','repositorio')}${row('URL','url_biblio')}</div>`;
    if(type==='book') return `<div class="g2">${row('Editorial','editorial')}${row('Edición','edicion','2.ª ed.')}</div>${row('URL','url_biblio')}`;
    if(type==='chapter') return `${area('Editor/es del libro (formato APA)','editores','Apellido, N. N.; Apellido, N. N.')}${row('Título del libro','titulo_libro')}<div class="g2">${row('Páginas del capítulo','paginas_biblio','23–41')}${row('Editorial','editorial')}</div>${row('URL','url_biblio')}`;
    return `<div class="g2">${row('Institución / organismo','institucion')}${row('Número de informe','numero_informe')}</div>${row('URL','url_biblio')}`;
  }

  function install(a){
    const sheet=document.getElementById('sheet'); if(!sheet) return;
    const apa=field('apa'); if(!apa) return;
    qa('.apa7-added',sheet).forEach(x=>x.remove());
    const f=(typeof F!=='undefined' ? F[aid(a)] : null)||{};
    const wrap=document.createElement('div'); wrap.className='apa7-added';
    wrap.innerHTML=`
      <h2 style="margin-top:4px">Metadatos bibliográficos</h2>
      <div class="form"><label>Tipo de publicación</label><select data-k="tipo_publicacion" id="tipoPublicacionApa">
        <option value="article">Artículo de revista</option><option value="thesis">Tesis</option><option value="book">Libro</option><option value="chapter">Capítulo de libro</option><option value="report">Informe / documento</option>
      </select></div>
      <div class="form"><label>Autores para APA 7 · uno por línea, en formato Apellido, N.</label><textarea data-k="autores_apa" id="autoresApa7" style="min-height:68px"></textarea><div class="taghint">La propuesta automática puede corregirse manualmente; queda guardada para este registro.</div></div>
      <div id="apaDynamicFields"></div>
      <div style="display:flex;gap:7px;align-items:center;margin:-2px 0 10px">
        <button type="button" id="regenApa7" style="padding:5px 10px">Regenerar APA 7</button>
        <button type="button" id="copyApa7Btn" style="padding:5px 10px;background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:700">📋 Copiar Cita APA 7</button>
        <span class="meta" id="copyStatusMsg"></span>
      </div>`;
    
    apa.closest('.form').parentNode.insertBefore(wrap,apa.closest('.form'));
    const type=q('#tipoPublicacionApa'); type.value=f.tipo_publicacion||'article';
    q('#autoresApa7').value=f.autores_apa||proposedAuthors(a.authors||val('autores'));

    function rebuild(){
      const current={}; qa('[data-k]',wrap).forEach(e=>current[e.dataset.k]=e.value);
      q('#apaDynamicFields').innerHTML=dynamicFields(type.value);
      qa('[data-k]',q('#apaDynamicFields')).forEach(e=>{
        if(f[e.dataset.k]!==undefined) e.value=f[e.dataset.k];
        else if(current[e.dataset.k]!==undefined) e.value=current[e.dataset.k];
      });
      if(type.value==='article'){
        setv('revista', f.revista || a.journal || a.source || a.origin || '');
        setv('volumen', f.volumen || a.volume || ''); setv('numero', f.numero || a.issue || ''); setv('paginas_biblio', f.paginas_biblio || a.pages_biblio || '');
      }
      if(!val('url_biblio')) setv('url_biblio',f.url_biblio||a.url||'');
      qa('[data-k]',wrap).forEach(e=>{e.addEventListener('input',changed);e.addEventListener('change',changed)});
      changed(false);
    }
    function changed(regen=true){
      if(regen){ apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true})); }
      try{ if(typeof autosave==='function') autosave(); }catch(e){}
    }
    type.addEventListener('change',()=>{rebuild(); apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true}))});
    q('#regenApa7').onclick=()=>{apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true})); try{autosave()}catch(e){}};
    
    q('#copyApa7Btn').onclick=async()=>{
      const textToCopy = apa.value || apa7();
      try {
        await navigator.clipboard.writeText(textToCopy);
        q('#copyStatusMsg').textContent = '✓ ¡Cita copiada al portapapeles!';
        q('#copyStatusMsg').style.color = '#7ee787';
      } catch(err) {
        q('#copyStatusMsg').textContent = 'Presioná Ctrl+C en el campo de texto.';
      }
      setTimeout(()=>{ q('#copyStatusMsg').textContent = ''; }, 3000);
    };

    rebuild();
    if(!f.apa || /Autor\/a|https:\/\/doi\.org|\(s\. f\.\)/.test(f.apa) || f.apa===apa.value){
      apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true}));
    }
    const lab=apa.closest('.form').querySelector('label'); if(lab) lab.textContent='Referencia APA 7 (generada automáticamente y editable)';
  }

  window.openReader=openReader=function(a){ previousOpenReader(a); setTimeout(()=>install(a),0); };
})();
</script>

</body></html>
