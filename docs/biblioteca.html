<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca | SCRAPEADORACADEMICO</title><style>
:root{--bg:#0d1117;--p:#161b22;--p2:#111820;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Segoe UI,Arial,sans-serif}a{color:var(--blue);text-decoration:none}button,input,select,textarea{font:inherit;color:var(--tx);background:#0d1117;border:1px solid var(--line);border-radius:7px;padding:8px 10px}button{cursor:pointer}.primary{background:#1f6feb;border-color:#1f6feb}.green{background:#238636;border-color:#238636}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:#0b1018;position:sticky;top:0;z-index:20}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:1.2rem;font-weight:800}.sub,.meta{color:var(--mut);font-size:.8rem}
.col-bar{display:flex;gap:8px;margin-top:10px;margin-bottom:6px}.col-btn{padding:7px 14px;border-radius:20px;font-weight:600;background:#161b22;border:1px solid var(--line);color:var(--tx)}.col-btn.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.tools{display:grid;grid-template-columns:1fr 150px 150px;gap:8px;margin-top:8px}
.library{display:grid;grid-template-columns:minmax(520px,1fr) 340px;gap:10px;height:calc(100vh - 165px);padding:10px}.pane{background:var(--p);border:1px solid var(--line);border-radius:99px;border-radius:9px;overflow:hidden}.ph{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--p2);display:flex;justify-content:space-between}.list{height:calc(100% - 42px);overflow:auto}.art,.report{padding:10px 12px;border-bottom:1px solid #242b35;cursor:pointer}.art:hover,.report:hover{background:#1c2530}.title{font-weight:650;line-height:1.35}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin:4px 4px 0 0;font-size:.72rem}.pill.ok{border-color:#238636;color:#7ee787}.pill.no{border-color:#9e6a03;color:#e3b341}.report-date{font-size:1rem;font-weight:800;color:var(--blue)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none}.overlay.open{display:flex;flex-direction:column}.ovh{height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:#0b1018}.ovbody{flex:1;overflow:auto;padding:20px;max-width:1200px;width:100%;margin:auto}.report-paper{padding:12px 0;border-bottom:1px solid var(--line)}
.reader{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;grid-template-columns:minmax(0,1.08fr) minmax(480px,.92fr)}.reader.open{display:grid}.reading{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column}.rh{min-height:66px;padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.viewer{flex:1;min-height:0;background:#20242a}.viewer iframe{width:100%;height:100%;border:0;background:white}.fallback{height:100%;overflow:auto;padding:28px;line-height:1.7;background:#fff;color:#111}.sheet{min-width:0;overflow:auto;padding:14px 18px}.sheet h2{font-size:1.05rem;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:7px}.sheet h2:first-child{margin-top:0}.form{margin-bottom:10px}.form label{display:block;color:var(--mut);font-size:.72rem;margin-bottom:4px}.form input,.form textarea,.form select{width:100%}.form textarea{min-height:82px;resize:vertical}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.autosave{position:sticky;bottom:0;background:#122017;padding:9px;border:1px solid #238636;border-radius:8px;color:#7ee787;font-size:.78rem;margin-top:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.textcheck{padding:7px 9px;border-radius:7px;font-size:.76rem}.textcheck.ok{background:#122017;color:#7ee787;border:1px solid #238636}.textcheck.no{background:#2b2111;color:#e3b341;border:1px solid #9e6a03}.quote-entry{display:grid;grid-template-columns:145px 78px 1fr 42px;gap:7px;align-items:end;margin-bottom:8px}.quote-entry textarea{min-height:72px}.plus{font-weight:900;font-size:1.15rem;padding:10px 0}.quotes{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.quote-card{display:grid;grid-template-columns:120px 55px 1fr 34px;gap:8px;padding:9px;background:#111820;border:1px solid var(--line);border-radius:8px;align-items:start}.qtag{color:#79c0ff;font-weight:700}.qpage{color:#e3b341}.qtext{white-space:pre-wrap;line-height:1.5}.qdel{padding:2px 6px;border:0;background:transparent;color:#f85149}.taghint{font-size:.72rem;color:var(--mut);margin:-5px 0 8px}.tagchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:-4px;margin-bottom:8px}.tagchip{font-size:.68rem;color:#79c0ff;border:1px solid #1f6feb;border-radius:999px;padding:2px 6px;background:#0d1b2a}@media(max-width:900px){.library{grid-template-columns:1fr;height:auto}.pane{height:60vh}.reader.open{grid-template-columns:1fr}.reading{height:52vh}.sheet{height:48vh}.quote-entry{grid-template-columns:100px 65px 1fr 38px}}
@media print{body>*{display:none!important}.reader.open{display:block!important;position:static}.reading{display:none}.sheet{display:block!important;overflow:visible}.autosave,.actions,.rh,.plus,.qdel{display:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>
</head><body>
<header>
  <div class="top">
    <div>
      <div class="brand">Biblioteca de investigación</div>
      <div class="sub">SCRAPEADORACADEMICO · buscar · revisar · leer · fichar</div>
    </div>
    <div class="actions">
      <a href="index.html">Dashboard</a>
      <button onclick="exportAll()">Exportar archivo maestro</button>
    </div>
  </div>
  <div class="col-bar">
    <button id="btnCorpus" class="col-btn active" onclick="switchCollection('corpus')">📚 Corpus Scraper (<span id="cntCorpus">0</span>)</button>
    <button id="btnTeoricos" class="col-btn" onclick="switchCollection('teoricos')">📖 Textos Teóricos & Libros (<span id="cntTeoricos">0</span>)</button>
  </div>
  <div class="tools">
    <input id="q" placeholder="Buscar título, autor, resumen, palabras clave o DOI..." autofocus>
    <select id="year"><option value="">Todos los años</option></select>
    <select id="state"><option value="">Todos los estados</option><option>Pendiente</option><option>Por leer</option><option>Leyendo</option><option>Leído</option><option>Fichado</option><option>Usado</option></select>
  </div>
</header>
<main class="library">
  <section class="pane">
    <div class="ph"><b id="listHeaderTitle">Artículos de investigación</b><span class="meta" id="count"></span></div>
    <div class="list" id="articles"></div>
  </section>
  <section class="pane">
    <div class="ph"><b>Revisiones e informes</b><span class="meta">clic para pantalla completa</span></div>
    <div class="list" id="reports"></div>
  </section>
</main>
<div class="overlay" id="reportOverlay"><div class="ovh"><div><b id="rt"></b><div class="meta" id="rm"></div></div><button onclick="closeReport()">Cerrar</button></div><div class="ovbody" id="rb"></div></div>
<div class="reader" id="reader"><section class="reading"><div class="rh"><div><b id="readTitle"></b><div class="meta" id="readMeta"></div><div id="textCheck"></div></div><div class="actions"><button id="ocrBtn" onclick="reviewOCR()">Revisar / generar OCR</button><button onclick="externalOpen()">Abrir original</button><button onclick="closeReader()">Volver</button></div></div><div class="viewer" id="viewer"></div></section><section class="sheet" id="sheet"></section></div>
<script>
let A_corpus=[], A_teoricos=[], R=[], F={}, selected=null, currentCollection='corpus';
const KEY='scrapeador_fichas_maestro_v3', $=x=>document.getElementById(x);
function norm(v){return(v||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function esc(v){return(v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function attr(v){return esc(v).replace(/"/g,'&quot;')}
function id(a){return a.record_id||a.doi||norm(a.title)}

async function loadMaster(){
  try{F=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){F={}};
  try{let root=await navigator.storage.getDirectory(),h=await root.getFileHandle('fichas_lectura.json');let file=await h.getFile(),txt=await file.text();if(txt.trim()){let disk=JSON.parse(txt);F={...disk,...F}}}catch(e){}
  localStorage.setItem(KEY,JSON.stringify(F));
}

async function saveMaster(){
  localStorage.setItem(KEY,JSON.stringify(F));
  try{let root=await navigator.storage.getDirectory(),h=await root.getFileHandle('fichas_lectura.json',{create:true}),w=await h.createWritable();await w.write(JSON.stringify(F,null,2));await w.close()}catch(e){}
}

async function init(){
  A_corpus=await fetch('library_articles.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>[]);
  A_teoricos=await fetch('teoricos_articles.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>[]);
  R=await fetch('report_history.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>[]);
  await loadMaster();
  $('cntCorpus').textContent=A_corpus.length.toLocaleString();
  $('cntTeoricos').textContent=A_teoricos.length.toLocaleString();
  populateYears();
  renderReports();
  filter();
}

function populateYears(){
  const activeList = currentCollection === 'corpus' ? A_corpus : A_teoricos;
  $('year').innerHTML = '<option value="">Todos los años</option>';
  [...new Set(activeList.map(x=>x.year).filter(Boolean))].sort().reverse().forEach(y=>$('year').insertAdjacentHTML('beforeend',`<option>${esc(y)}</option>`));
}

function switchCollection(col){
  currentCollection = col;
  $('btnCorpus').classList.toggle('active', col === 'corpus');
  $('btnTeoricos').classList.toggle('active', col === 'teoricos');
  $('listHeaderTitle').textContent = col === 'corpus' ? 'Artículos de investigación (Corpus)' : 'Textos Teóricos & Libros (Drive)';
  populateYears();
  filter();
}

function state(a){return(F[id(a)]||{}).estado||'Pendiente'}
function textBadge(a){
  if(a.collection==='teoricos') return '<span class="pill ok">PDF en Drive Teórico</span>';
  if(a.text_status==='ok')return '<span class="pill ok">Texto copiable detectado</span>';
  if(a.text_status)return '<span class="pill no">Sin texto detectable / revisar OCR</span>';
  return '<span class="pill">Sin verificación de texto</span>';
}

function filter(){
  let activeList = currentCollection === 'corpus' ? A_corpus : A_teoricos;
  let q=norm($('q').value),y=$('year').value,st=$('state').value;
  let x=activeList.filter(a=>(!q||norm([a.title,a.authors,a.abstract,a.keywords,a.doi,a.origin,a.source].join(' ')).includes(q))&&(!y||a.year===y)&&(!st||state(a)===st));
  $('count').textContent=x.length.toLocaleString()+' resultados';
  $('articles').innerHTML='';
  x.slice(0,700).forEach(a=>{
    let d=document.createElement('div');d.className='art';
    d.innerHTML=`<div class="title">${esc(a.title)}</div><div class="meta">${esc(a.authors)} · ${esc(a.year)} · ${esc(a.origin||a.source)}</div><span class="pill">${esc(state(a))}</span>${textBadge(a)}`;
    d.onclick=()=>openReader(a);
    $('articles').appendChild(d);
  });
}

function renderReports(){
  $('reports').innerHTML='';
  R.slice().reverse().forEach(r=>{
    let d=document.createElement('div');d.className='report';
    d.innerHTML=`<div class="report-date">${esc(r.date.split('-').reverse().join('/'))}</div><div class="title">Informe de actualización bibliográfica</div><div class="meta">${r.new} incorporaciones · base acumulada ${r.base}</div><div class="meta">${esc(r.sources)}</div>`;
    d.onclick=()=>openReport(r);
    $('reports').appendChild(d);
  });
}

function openReport(r){
  let items=A_corpus.filter(a=>(a.first_seen_date||'').startsWith(r.date));
  $('rt').textContent='Informe · '+r.date.split('-').reverse().join('/');
  $('rm').textContent=`${r.new} incorporaciones · base ${r.base} · ${r.sources}`;
  $('rb').innerHTML=`<p class="meta">Se muestran ${items.length} registros identificados en la base para esta corrida.</p>`+items.map((a,i)=>`<div class="report-paper"><div class="title">${i+1}. ${esc(a.title)}</div><div class="meta">${esc(a.authors)} · ${esc(a.year)} · ${esc(a.origin||a.source)}</div>${textBadge(a)}<br><button class="primary" onclick='readById(${JSON.stringify(id(a))})'>Leer y fichar</button></div>`).join('');
  $('reportOverlay').classList.add('open');
}

function closeReport(){$('reportOverlay').classList.remove('open')}
function readById(i){let a=[...A_corpus,...A_teoricos].find(x=>id(x)===i);if(a){closeReport();openReader(a)}}
function apaAuto(a){let au=(a.authors||'').split(';').map(x=>x.trim()).filter(Boolean);let author=au.length?au.join(', '):'Autor/a';return `${author} (${a.year||'s. f.'}). ${a.title}. ${a.origin||a.source||''}${a.doi?'. https://doi.org/'+a.doi:''}`}
function viewerUrl(a){if(a.drive_file_id)return `https://drive.google.com/file/d/${encodeURIComponent(a.drive_file_id)}/preview`;let u=a.pdf_url||a.url;if(!u)return '';if(/\.pdf($|\?)/i.test(u)||a.pdf_url)return `https://docs.google.com/gview?embedded=1&url=${encodeURIComponent(u)}`;return u}

function openReader(a){
  selected=a;let f=F[id(a)]||{};
  $('readTitle').textContent=a.title;
  $('readMeta').textContent=`${a.authors||''} · ${a.year||''}${a.pages?' · '+a.pages+' págs.':''}`;
  if(a.collection==='teoricos') $('textCheck').innerHTML='<div class="textcheck ok">✓ Documento de la Biblioteca Teórica de Drive.</div>';
  else if(a.text_status==='ok')$('textCheck').innerHTML='<div class="textcheck ok">✓ Capa de texto detectada: debería permitir seleccionar y copiar citas.</div>';
  else if(a.text_status)$('textCheck').innerHTML='<div class="textcheck no">⚠ No se detectó texto extraíble. El PDF puede requerir OCR para copiar citas.</div>';
  else $('textCheck').innerHTML='<div class="textcheck no">? Este PDF todavía no fue verificado por el extractor de texto.</div>';
  
  let src=viewerUrl(a);
  $('viewer').innerHTML=src?`<iframe src="${attr(src)}" allow="clipboard-read; clipboard-write"></iframe>`:`<div class="fallback"><h2>${esc(a.title)}</h2><p>${esc(a.abstract||'No hay PDF disponible para lectura interna.')}</p></div>`;
  let val=(k,d='')=>f[k]!==undefined?f[k]:d;let quotes=Array.isArray(f.citas_lista)?f.citas_lista:[];
  $('sheet').innerHTML=`<h2>Metadatos</h2><div class="g2">${inp('titulo','Título',val('titulo',a.title))}${inp('anio','Año',val('anio',a.year))}</div>${inp('autores','Autores',val('autores',a.authors))}${inp('apa','Cita / referencia APA preliminar (editable)',val('apa',apaAuto(a)))}<div class="g2">${inp('doi','DOI',val('doi',a.doi))}${inp('fuente','Fuente / revista',val('fuente',a.origin||a.source))}</div>
<h2>1. Citas literales</h2><div class="quote-entry"><div class="form"><label>Etiqueta</label><input id="qtag" placeholder="ej. regulación"></div><div class="form"><label>Página</label><input id="qpage" placeholder="p. 12"></div><div class="form"><label>Cita literal</label><textarea id="qtext" placeholder="Pegá aquí la cita textual..."></textarea></div><button class="primary plus" title="Guardar cita y agregar otra" onclick="addQuote()">+</button></div><div class="quotes" id="quotes"></div>
<h2>2. Lectura y análisis</h2><div class="taghint">En estos campos podés escribir etiquetas dentro del texto usando @, por ejemplo: @regulación @afectos @responsabilización.</div><div class="g2">${sel('estado','Estado',['Pendiente','Por leer','Leyendo','Leído','Fichado','Usado'],val('estado','Leyendo'))}${sel('relevancia','Relevancia',['','Central','Alta','Media','Contextual','Descartar'],val('relevancia'))}</div>${inp('tipo_uso','Tipo de uso',val('tipo_uso'),'antecedente, marco conceptual, metodología, evidencia, discusión')}${ta('problema','Problema / pregunta del texto',val('problema'))}${ta('objetivo','Objetivo',val('objetivo'))}${ta('marco','Marco conceptual / conceptos',val('marco'))}${ta('metodo','Metodología / corpus',val('metodo'))}${ta('hallazgos','Hallazgos principales',val('hallazgos'))}${ta('aporte','Aporte para mi investigación',val('aporte'))}${ta('discusion','Discusión propia / desacuerdos',val('discusion'))}${ta('relaciones','Relaciones con otros textos / autores',val('relaciones'))}${inp('proyecto','Dónde podría usarlo / proyecto',val('proyecto'))}${inp('tags','Etiquetas generales',val('tags'),'regulación, afectos, dirección escolar...')}${ta('notas','Notas libres',val('notas'))}<div id="inlineTags" class="tagchips"></div><div class="actions"><button onclick="window.print()">Guardar ficha como PDF</button></div><div class="autosave" id="autosave">✓ Guardado automático activo · archivo maestro único</div>`;
  $('sheet').querySelectorAll('[data-k]').forEach(e=>{e.addEventListener('input',()=>{refreshTags();autosave()});e.addEventListener('change',autosave)});
  F[id(a)]={...f,citas_lista:quotes};renderQuotes();refreshTags();autosave();$('reader').classList.add('open');
}

function inp(k,l,v,p=''){return`<div class="form"><label>${l}</label><input data-k="${k}" value="${attr(v||'')}" placeholder="${attr(p)}"></div>`}
function ta(k,l,v){return`<div class="form"><label>${l}</label><textarea data-k="${k}">${esc(v||'')}</textarea></div>`}
function sel(k,l,opts,v){return`<div class="form"><label>${l}</label><select data-k="${k}">${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function addQuote(){if(!selected)return;let tag=$('qtag').value.trim(),page=$('qpage').value.trim(),text=$('qtext').value.trim();if(!text)return;$('qtext').focus();let f=F[id(selected)]||{},arr=Array.isArray(f.citas_lista)?f.citas_lista:[];arr.push({tag,page,text,created_at:new Date().toISOString()});f.citas_lista=arr;F[id(selected)]=f;$('qtag').value='';$('qpage').value='';$('qtext').value='';renderQuotes();autosave();$('qtag').focus()}
function renderQuotes(){if(!selected||!$('quotes'))return;let arr=(F[id(selected)]||{}).citas_lista||[];$('quotes').innerHTML=arr.map((q,i)=>`<div class="quote-card"><div class="qtag">${q.tag?'#'+esc(q.tag):'—'}</div><div class="qpage">${esc(q.page||'—')}</div><div class="qtext">${esc(q.text)}</div><button class="qdel" onclick="deleteQuote(${i})" title="Eliminar">×</button></div>`).join('')}
function deleteQuote(i){let f=F[id(selected)]||{},arr=f.citas_lista||[];arr.splice(i,1);f.citas_lista=arr;F[id(selected)]=f;renderQuotes();autosave()}
function collectInlineTags(){let tags=new Set();$('sheet').querySelectorAll('[data-k]').forEach(e=>{let m=e.value.match(/@[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9_-]+/g)||[];m.forEach(x=>tags.add(x))});return [...tags]}
function refreshTags(){if(!selected||!$('inlineTags'))return;let tags=collectInlineTags();$('inlineTags').innerHTML=tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('');let f=F[id(selected)]||{};f.inline_tags=tags;F[id(selected)]=f}
let timer;function autosave(){if(!selected)return;let f={...(F[id(selected)]||{})};$('sheet').querySelectorAll('[data-k]').forEach(e=>f[e.dataset.k]=e.value);f.inline_tags=collectInlineTags();f.updated_at=new Date().toISOString();F[id(selected)]=f;let x=$('autosave');if(x){x.textContent='Guardando…';clearTimeout(timer);timer=setTimeout(async()=>{await saveMaster();x.textContent='✓ Guardado automáticamente · fichas acumuladas: '+Object.keys(F).length},300)}filter()}
function closeReader(){autosave();$('reader').classList.remove('open');selected=null}
function externalOpen(){if(selected&&(selected.drive_file_id||selected.pdf_url||selected.url)){let u=selected.drive_file_id?`https://drive.google.com/file/d/${selected.drive_file_id}/view`:selected.pdf_url||selected.url;window.open(u,'_blank')}}
function exportAll(){let blob=new Blob([JSON.stringify(F,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='fichas_lectura.json';a.click();URL.revokeObjectURL(u)}
$('q').oninput=filter;$('year').onchange=filter;$('state').onchange=filter;init();
</script>
<script>
(function(){
  if(window.__libraryPdfViewerInstalled)return;
  window.__libraryPdfViewerInstalled=true;
  const baseOpenReader=window.openReader||openReader;
  function escV(v){return(v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function currentFicha(a){try{const fid=(typeof id==='function')?id(a):(a.record_id||a.doi||a.title);const store=(typeof F!=='undefined')?F:(window.F||{});return store[fid]||{}}catch(e){return{}}}
  function showSavedText(a){
    const f=currentFicha(a); if(!f.ocr_text)return false;
    const viewer=document.getElementById('viewer'); if(!viewer)return false;
    viewer.innerHTML='<div class="fallback" style="white-space:pre-wrap;font-family:Georgia,serif;line-height:1.58">'
      +'<div style="position:sticky;top:0;background:#fff;padding:8px 0 12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;color:#555">'
      +'<b>Texto guardado · '+escV(f.ocr_language_label||'texto extraído')+'</b> · seleccionable y copiable</div>'
      +escV(f.ocr_text)+'</div>';
    return true;
  }
  function renderDrive(a){
    const viewer=document.getElementById('viewer'); if(!viewer)return;
    const preview=a.drive_preview_url||(a.drive_file_id?('https://drive.google.com/file/d/'+encodeURIComponent(a.drive_file_id)+'/preview'):'');
    const open=a.drive_open_url||(a.drive_file_id?('https://drive.google.com/file/d/'+encodeURIComponent(a.drive_file_id)+'/view'):'');
    if(!preview){

<script>
(function(){

<script>
(function(){
  if (window.__libraryOCRInstalled) return;
  window.__libraryOCRInstalled = true;
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }

  const OCR_LANGS = {
    spa: {label:'Español', words:[' el ',' la ',' los ',' las ',' de ',' que ',' para ',' una ',' dirección ',' escuela ',' educación ',' escolar ',' desigualdad ',' docente ']},
    eng: {label:'Inglés', words:[' the ',' of ',' and ',' to ',' in ',' school ',' education ',' leadership ',' teachers ',' students ',' policy ']},
    por: {label:'Portugués', words:[' de ',' que ',' para ',' uma ',' escola ',' educação ',' gestão ',' professores ',' alunos ',' ensino ']}
  };

  function inferOCRLanguage(a){
    const raw = (' ' + ((a&&a.title)||'') + ' ' + ((a&&a.abstract)||'') + ' ' + ((a&&a.keywords)||'') + ' ').toLowerCase();
    const scores = {};
    for (const [code,info] of Object.entries(OCR_LANGS)) {
      scores[code] = info.words.reduce((n,w)=>n + (raw.split(w).length-1),0);
    }
    // Acentos distintivos como apoyo cuando hay pocos metadatos.
    scores.spa += (raw.match(/[ñ¿¡]/g)||[]).length * 2;
    scores.por += (raw.match(/[ãõç]/g)||[]).length * 2;
    scores.eng += (raw.match(/\b(the|with|from|between|through)\b/g)||[]).length;
    let code = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    if (Math.max(...Object.values(scores)) === 0) code = 'spa';
    return {code, label:OCR_LANGS[code].label, scores};
  }

  function setOCRStatus(msg, cls=''){
    const box = document.getElementById('textCheck');
    if (!box) return;
    box.innerHTML = '<div class="textcheck '+cls+'">'+msg+'</div>';
  }

  function showOCRText(text, langLabel){
    const viewer = document.getElementById('viewer');
    if (!viewer) return;
    viewer.innerHTML = '<div class="fallback" style="white-space:pre-wrap;font-family:Georgia,serif;line-height:1.55"><div style="position:sticky;top:0;background:white;padding:6px 0 10px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;color:#555"><b>Texto OCR · '+langLabel+'</b> · seleccionable y copiable · los separadores indican la página</div>'+escapeOCR(text)+'</div>';
  }

  function escapeOCR(v){
    return (v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  }

  async function getPdfSource(a){
    if (!a) throw new Error('No hay artículo seleccionado.');
    const src = a.pdf_url || a.url;
    if (!src) throw new Error('Este registro no tiene URL de PDF disponible.');
    return src;
  }

  async function inspectNativeText(pdf, maxPages=3){
    let chars=0, pages=0;
    for (let n=1;n<=Math.min(pdf.numPages,maxPages);n++){
      const page=await pdf.getPage(n);
      const tc=await page.getTextContent();
      const txt=(tc.items||[]).map(i=>i.str||'').join(' ').trim();
      chars += txt.length; pages++;
    }
    return {chars,pages,avg:pages?chars/pages:0,hasText:pages ? chars/pages >= 120 : false};
  }

  async function extractNativeText(pdf){
    const chunks=[];
    for(let n=1;n<=pdf.numPages;n++){
      setOCRStatus('Extrayendo texto existente · página '+n+' de '+pdf.numPages+'…','ok');
      const page=await pdf.getPage(n);
      const tc=await page.getTextContent();
      const txt=(tc.items||[]).map(i=>i.str||'').join(' ').trim();
      chunks.push('\\n\\n===== PÁGINA '+n+' =====\\n\\n'+txt);
    }
    return chunks.join('');
  }

  async function runOCR(pdf, lang){
    const chunks=[];
    const worker = await Tesseract.createWorker(lang, 1, {
      logger: m => {
        if (m && m.status === 'recognizing text' && typeof m.progress === 'number') {
          const pct=Math.round(m.progress*100);
          setOCRStatus('OCR '+OCR_LANGS[lang].label+' · '+pct+'% de la página actual…','');
        }
      }
    });
    try {
      for(let n=1;n<=pdf.numPages;n++){
        setOCRStatus('OCR '+OCR_LANGS[lang].label+' · página '+n+' de '+pdf.numPages+'…','');
        const page=await pdf.getPage(n);
        const viewport=page.getViewport({scale:1.65});
        const canvas=document.createElement('canvas');
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
        await page.render({canvasContext:ctx,viewport}).promise;
        const ret=await worker.recognize(canvas);
        const txt=((ret&&ret.data&&ret.data.text)||'').trim();
        chunks.push('\\n\\n===== PÁGINA '+n+' =====\\n\\n'+txt);
        canvas.width=1; canvas.height=1;
      }
    } finally {
      await worker.terminate();
    }
    return chunks.join('');
  }

  window.reviewOCR = async function(){
    if (!window.selected) {
      setOCRStatus('No hay artículo seleccionado.','no'); return;
    }
    const btn=document.getElementById('ocrBtn');
    if(btn){btn.disabled=true;btn.textContent='Revisando OCR…';}
    try{
      if(!window.pdfjsLib || !window.Tesseract) throw new Error('No se pudieron cargar los componentes OCR. Recargá la página.');
      const src=await getPdfSource(window.selected);
      const inferred=inferOCRLanguage(window.selected);
      setOCRStatus('Idioma probable: '+inferred.label+' · verificando capa de texto…','');
      const pdf=await pdfjsLib.getDocument({url:src,withCredentials:false}).promise;
      const native=await inspectNativeText(pdf);
      let text, mode;
      if(native.hasText){
        text=await extractNativeText(pdf);
        mode='texto nativo';
        setOCRStatus('✓ Texto copiable detectado · OCR innecesario · idioma probable: '+inferred.label,'ok');
      }else{
        setOCRStatus('Sin texto suficiente · iniciando OCR en '+inferred.label+'…','no');
        text=await runOCR(pdf,inferred.code);
        mode='ocr';
        setOCRStatus('✓ OCR generado · '+inferred.label+' · '+pdf.numPages+' páginas','ok');
      }
      const fid=(window.id && id(window.selected)) || window.selected.record_id || window.selected.doi || window.selected.title;
      window.F = window.F || {};
      const f={...(F[fid]||{})};
      f.ocr_text=text; f.ocr_language=inferred.code; f.ocr_language_label=inferred.label; f.ocr_mode=mode; f.ocr_pages=pdf.numPages; f.ocr_updated_at=new Date().toISOString();
      F[fid]=f;
      if(typeof saveMaster==='function') await saveMaster();
      showOCRText(text,inferred.label);
    }catch(err){
      console.error(err);
      const msg=(err&&err.message)||String(err);
      setOCRStatus('⚠ No se pudo revisar OCR dentro de la página: '+msg+' Puede deberse a restricciones de acceso/CORS del PDF.','no');
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Revisar / generar OCR';}
    }
  };
})();
</script>


<script>
(function(){
  if(window.__apa7MetadataInstalled) return;
  window.__apa7MetadataInstalled=true;
  const previousOpenReader=window.openReader || openReader;

  // Atajo de teclado ESC para volver a la lista
  document.addEventListener('keydown', function(evt){
    if(evt.key === 'Escape'){
      const reader = document.getElementById('reader');
      const overlay = document.getElementById('reportOverlay');
      if(overlay && overlay.classList.contains('open')){
        closeReport();
      } else if(reader && reader.classList.contains('open')){
        closeReader();
      }
    }
  });

  function q(sel, root=document){return root.querySelector(sel)}
  function qa(sel, root=document){return [...root.querySelectorAll(sel)]}
  function esc(v){return (v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function aid(a){try{return id(a)}catch(e){return a.record_id||a.doi||a.title}}
  function field(k){return q('[data-k="'+k+'"]')}
  function val(k){const el=field(k); return el?el.value.trim():''}
  function setv(k,v){const el=field(k); if(el && !el.value) el.value=v||''}

  function splitAuthors(raw){
    return (raw||'').split(/\s*;\s*|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);
  }
  function initials(given){
    return (given||'').split(/[\s-]+/).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+'.').join(' ');
  }
  function bestAuthor(name){
    name=(name||'').trim(); if(!name) return '';
    if(name.includes(',')){
      let [sur,...rest]=name.split(','); return sur.trim()+', '+initials(rest.join(' ').trim());
    }
    const t=name.split(/\s+/).filter(Boolean); if(t.length===1) return t[0];
    const particles=new Set(['de','del','la','las','los','da','das','do','dos','di','van','von']);
    let start=Math.max(1,t.length-2);
    while(start>1 && particles.has(t[start-1].toLowerCase())) start--;
    if(start>1 && t.slice(start).some(x=>particles.has(x.toLowerCase()))) start--;
    const given=t.slice(0,start).join(' '), sur=t.slice(start).join(' ');
    return sur+', '+initials(given);
  }
  function proposedAuthors(raw){return splitAuthors(raw).map(bestAuthor).join('\n')}
  function apaAuthors(raw){
    let arr=(raw||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(!arr.length) return '';
    if(arr.length===1) return arr[0];
    if(arr.length===2) return arr[0]+', & '+arr[1];
    return arr.slice(0,-1).join(', ')+', & '+arr[arr.length-1];
  }
  function sentenceTitle(s){
    s=(s||'').trim(); if(!s) return '';
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function doiUrl(v){
    v=(v||'').trim(); if(!v) return '';
    v=v.replace(/^https?:\/\/(dx\.)?doi\.org\//i,'');
    return 'https://doi.org/'+v;
  }
  function enddot(s){s=(s||'').trim(); return s && !/[.!?]$/.test(s)?s+'.':s}
  function pagesNorm(v){return (v||'').trim().replace(/^pp?\.\s*/i,'')}

  function apa7(){
    const type=val('tipo_publicacion')||'article';
    const authors=apaAuthors(val('autores_apa')) || val('autores');
    const year=val('anio')||'s. f.';
    const title=sentenceTitle(val('titulo'));
    const doi=doiUrl(val('doi'));
    const url=val('url_biblio');
    let out='';
    if(type==='article'){
      const journal=val('revista'), vol=val('volumen'), num=val('numero'), pages=pagesNorm(val('paginas_biblio'));
      out=`${enddot(authors)} (${year}). ${enddot(title)} ${journal}`;
      if(vol) out+=`, ${vol}`;
      if(num) out+=`(${num})`;
      if(pages) out+=`, ${pages}`;
      out+='.';
      if(doi) out+=' '+doi; else if(url) out+=' '+url;
    } else if(type==='thesis'){
      const degree=val('tipo_tesis')||'Tesis'; const inst=val('institucion'); const repo=val('repositorio');
      out=`${enddot(authors)} (${year}). ${title} [${degree}, ${inst||'Institución'}].`;
      if(repo) out+=` ${repo}.`; if(url||doi) out+=' '+(doi||url);
    } else if(type==='book'){
      const edition=val('edicion'), publisher=val('editorial');
      out=`${enddot(authors)} (${year}). ${title}`;
      if(edition) out+=` (${edition})`;
      out+='.'; if(publisher) out+=` ${publisher}.`; if(doi||url) out+=' '+(doi||url);
    } else if(type==='chapter'){
      const eds=val('editores'), book=val('titulo_libro'), pages=pagesNorm(val('paginas_biblio')), publisher=val('editorial');
      out=`${enddot(authors)} (${year}). ${enddot(title)} En ${eds||'Editor/a'} (Ed.), ${book||'Título del libro'}`;
      if(pages) out+=` (pp. ${pages})`; out+='.'; if(publisher) out+=` ${publisher}.`; if(doi||url) out+=' '+(doi||url);
    } else if(type==='report'){
      const org=val('institucion')||val('editorial'); const n=val('numero_informe');
      out=`${enddot(authors||org)} (${year}). ${title}`;
      if(n) out+=` (Informe n.º ${n})`; out+='.'; if(org && authors!==org) out+=` ${org}.`; if(doi||url) out+=' '+(doi||url);
    }
    return out.replace(/\s+/g,' ').replace(/\s+\./g,'.').trim();
  }

  function row(label,k,placeholder=''){
    return `<div class="form bib-extra"><label>${esc(label)}</label><input data-k="${esc(k)}" placeholder="${esc(placeholder)}"></div>`;
  }
  function area(label,k,placeholder=''){
    return `<div class="form bib-extra"><label>${esc(label)}</label><textarea data-k="${esc(k)}" placeholder="${esc(placeholder)}" style="min-height:58px"></textarea></div>`;
  }
  function dynamicFields(type){
    if(type==='article') return `<div class="g2">${row('Revista / Fuente','revista')}${row('Volumen','volumen')}</div><div class="g2">${row('Número','numero')}${row('Páginas','paginas_biblio','23–41')}</div>`;
    if(type==='thesis') return `<div class="g2">${row('Tipo de tesis','tipo_tesis','Tesis doctoral / Tesis de maestría')}${row('Institución','institucion')}</div><div class="g2">${row('Repositorio','repositorio')}${row('URL','url_biblio')}</div>`;
    if(type==='book') return `<div class="g2">${row('Editorial','editorial')}${row('Edición','edicion','2.ª ed.')}</div>${row('URL','url_biblio')}`;
    if(type==='chapter') return `${area('Editor/es del libro (formato APA)','editores','Apellido, N. N.; Apellido, N. N.')}${row('Título del libro','titulo_libro')}<div class="g2">${row('Páginas del capítulo','paginas_biblio','23–41')}${row('Editorial','editorial')}</div>${row('URL','url_biblio')}`;
    return `<div class="g2">${row('Institución / organismo','institucion')}${row('Número de informe','numero_informe')}</div>${row('URL','url_biblio')}`;
  }

  function install(a){
    const sheet=document.getElementById('sheet'); if(!sheet) return;
    const apa=field('apa'); if(!apa) return;
    qa('.apa7-added',sheet).forEach(x=>x.remove());
    const f=(typeof F!=='undefined' ? F[aid(a)] : null)||{};
    const wrap=document.createElement('div'); wrap.className='apa7-added';
    wrap.innerHTML=`
      <h2 style="margin-top:4px">Metadatos bibliográficos</h2>
      <div class="form"><label>Tipo de publicación</label><select data-k="tipo_publicacion" id="tipoPublicacionApa">
        <option value="article">Artículo de revista</option><option value="thesis">Tesis</option><option value="book">Libro</option><option value="chapter">Capítulo de libro</option><option value="report">Informe / documento</option>
      </select></div>
      <div class="form"><label>Autores para APA 7 · uno por línea, en formato Apellido, N.</label><textarea data-k="autores_apa" id="autoresApa7" style="min-height:68px"></textarea><div class="taghint">La propuesta automática puede corregirse manualmente; queda guardada para este registro.</div></div>
      <div id="apaDynamicFields"></div>
      <div style="display:flex;gap:7px;align-items:center;margin:-2px 0 10px">
        <button type="button" id="regenApa7" style="padding:5px 10px">Regenerar APA 7</button>
        <button type="button" id="copyApa7Btn" style="padding:5px 10px;background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:700">📋 Copiar Cita APA 7</button>
        <span class="meta" id="copyStatusMsg"></span>
      </div>`;
    
    apa.closest('.form').parentNode.insertBefore(wrap,apa.closest('.form'));
    const type=q('#tipoPublicacionApa'); type.value=f.tipo_publicacion||'article';
    q('#autoresApa7').value=f.autores_apa||proposedAuthors(a.authors||val('autores'));

    function rebuild(){
      const current={}; qa('[data-k]',wrap).forEach(e=>current[e.dataset.k]=e.value);
      q('#apaDynamicFields').innerHTML=dynamicFields(type.value);
      qa('[data-k]',q('#apaDynamicFields')).forEach(e=>{
        if(f[e.dataset.k]!==undefined) e.value=f[e.dataset.k];
        else if(current[e.dataset.k]!==undefined) e.value=current[e.dataset.k];
      });
      if(type.value==='article'){
        setv('revista', f.revista || a.journal || a.source || a.origin || '');
        setv('volumen', f.volumen || a.volume || ''); setv('numero', f.numero || a.issue || ''); setv('paginas_biblio', f.paginas_biblio || a.pages_biblio || '');
      }
      if(!val('url_biblio')) setv('url_biblio',f.url_biblio||a.url||'');
      qa('[data-k]',wrap).forEach(e=>{e.addEventListener('input',changed);e.addEventListener('change',changed)});
      changed(false);
    }
    function changed(regen=true){
      if(regen){ apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true})); }
      try{ if(typeof autosave==='function') autosave(); }catch(e){}
    }
    type.addEventListener('change',()=>{rebuild(); apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true}))});
    q('#regenApa7').onclick=()=>{apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true})); try{autosave()}catch(e){}};
    
    q('#copyApa7Btn').onclick=async()=>{
      const textToCopy = apa.value || apa7();
      try {
        await navigator.clipboard.writeText(textToCopy);
        q('#copyStatusMsg').textContent = '✓ ¡Cita copiada al portapapeles!';
        q('#copyStatusMsg').style.color = '#7ee787';
      } catch(err) {
        q('#copyStatusMsg').textContent = 'Presioná Ctrl+C en el campo de texto.';
      }
      setTimeout(()=>{ q('#copyStatusMsg').textContent = ''; }, 3000);
    };

    rebuild();
    if(!f.apa || /Autor\/a|https:\/\/doi\.org|\(s\. f\.\)/.test(f.apa) || f.apa===apa.value){
      apa.value=apa7(); apa.dispatchEvent(new Event('input',{bubbles:true}));
    }
    const lab=apa.closest('.form').querySelector('label'); if(lab) lab.textContent='Referencia APA 7 (generada automáticamente y editable)';
  }

  window.openReader=openReader=function(a){ previousOpenReader(a); setTimeout(()=>install(a),0); };
})();
</script>


<script>
(function(){
  if (window.__aiAssistantModuleInstalled) return;
  window.__aiAssistantModuleInstalled = true;

  function esc(v){return (v||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function norm(v){return(v||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

  function buildApa7(a) {
    let rawAuthors = (a.authors || '').split(/\s*;\s*|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);
    let formattedAuthors = rawAuthors.map(name => {
      if (name.includes(',')) return name;
      let parts = name.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0];
      let surname = parts.pop();
      let init = parts.map(p => p[0].toUpperCase() + '.').join(' ');
      return `${surname}, ${init}`;
    });
    
    let authorsStr = '';
    if (formattedAuthors.length === 1) authorsStr = formattedAuthors[0];
    else if (formattedAuthors.length === 2) authorsStr = formattedAuthors[0] + ', & ' + formattedAuthors[1];
    else if (formattedAuthors.length > 2) authorsStr = formattedAuthors.slice(0, -1).join(', ') + ', & ' + formattedAuthors[formattedAuthors.length - 1];
    else authorsStr = 'Autor/a';

    let year = a.year || 's. f.';
    let title = (a.title || '[Sin título]').trim();
    if (title.length > 1) title = title.charAt(0).toUpperCase() + title.slice(1);
    let source = a.origin || a.source || (a.collection === 'teoricos' ? 'Biblioteca Teórica Drive' : 'Revista Científica');
    let doi = a.doi ? (a.doi.startsWith('http') ? a.doi : 'https://doi.org/' + a.doi) : (a.url || '');

    return `${authorsStr}. (${year}). ${title}. ${source}.${doi ? ' ' + doi : ''}`;
  }

  function initAiAssistantUI() {
    const colBar = document.querySelector('.col-bar');
    if (!colBar) return;

    // UN SOLO BOTÓN UNIFICADO
    const btnAi = document.createElement('button');
    btnAi.id = 'btnAiAssistant';
    btnAi.className = 'col-btn';
    btnAi.style.background = 'linear-gradient(135deg, #1f6feb 0%, #8957e5 100%)';
    btnAi.style.borderColor = '#8957e5';
    btnAi.style.color = '#fff';
    btnAi.style.fontWeight = '800';
    btnAi.innerHTML = '🤖 Asistente IA & Buscador de Citas APA 7 (Qwen 2.5)';
    colBar.appendChild(btnAi);

    const main = document.querySelector('main.library');
    const aiPane = document.createElement('div');
    aiPane.id = 'aiAssistantPane';
    aiPane.style.display = 'none';
    aiPane.style.padding = '18px';
    aiPane.style.background = '#111820';
    aiPane.style.border = '1px solid #8957e5';
    aiPane.style.borderRadius = '10px';
    aiPane.style.marginTop = '10px';
    aiPane.style.boxShadow = '0 8px 24px rgba(0,0,0,0.5)';

    aiPane.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid #30363d;padding-bottom:10px">
        <div>
          <h2 style="margin:0;font-size:1.2rem;color:#79c0ff">🤖 Módulo Unificado: Asistente IA, Validación de Fuentes & Citas APA 7 (Qwen 2.5)</h2>
          <div style="font-size:0.82rem;color:#8b949e">Consulta conceptos, valida frases o preguntale a la IA sobre los <b>2.087 artículos del corpus</b> + <b>37 textos teóricos de Drive</b>.</div>
        </div>
        <button id="closeAiPaneBtn" type="button" style="padding:4px 12px;background:#21262d;border:1px solid #30363d;color:#fff;cursor:pointer">✕ Cerrar</button>
      </div>

      <div style="display:grid;grid-template-columns:1fr 220px 180px;gap:10px;margin-bottom:12px">
        <textarea id="aiPrompt" placeholder="Ingresá un concepto, frase a validar o pregunta (ej: @regulación, gobernanza, Foucault, 'liderazgo en escuelas públicas')..." style="font-size:0.95rem;padding:10px 14px;min-height:65px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:6px"></textarea>
        
        <select id="conceptScope" style="background:#0d1117;color:#fff;font-size:0.85rem">
          <option value="all">Todos los materiales (2.124)</option>
          <option value="corpus">Solo Corpus Scraper (2.087)</option>
          <option value="teoricos">Solo Textos Teóricos (37)</option>
        </select>

        <div style="display:flex;flex-direction:column;gap:6px">
          <button id="runAiSearchBtn" type="button" style="flex:1;background:#8957e5;border-color:#8957e5;color:#fff;font-weight:800;font-size:0.92rem;cursor:pointer">⚡ Consultar con Qwen 2.5</button>
        </div>
      </div>

      <div id="aiConfigBox" style="font-size:0.78rem;color:#c9d1d9;margin-bottom:14px;background:#0d1117;padding:10px 14px;border-radius:6px;border:1px solid #30363d;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <label><b>Modelo IA:</b></label>
          <select id="aiProviderSelect" style="padding:4px 8px;background:#161b22;color:#fff">
            <option value="openrouter">Qwen 2.5-72B (OpenRouter API - qwen/qwen-2.5-72b-instruct)</option>
            <option value="ollama">Qwen Local (Ollama / LM Studio en http://localhost:11434/v1)</option>
            <option value="together">Qwen 2.5 (Together AI)</option>
            <option value="gemini">Google Gemini 1.5 Flash</option>
          </select>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <label><b>Clave de API / Key:</b></label>
          <input type="password" id="qwenApiKeyInput" placeholder="Pegá tu API Key de OpenRouter, Together o Gemini aquí (opcional para Ollama local)" style="flex:1;font-size:0.78rem;padding:4px 8px;background:#161b22">
          <button type="button" id="saveApiKeyBtn" style="padding:4px 10px;font-size:0.78rem;background:#238636;border-color:#238636;color:#fff">Guardar</button>
        </div>
      </div>

      <div id="aiResponseContainer" style="display:none;margin-top:14px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:16px">
        <div id="aiSynthesisHeader" style="font-weight:700;color:#79c0ff;margin-bottom:10px;font-size:1.05rem;display:flex;align-items:center;gap:8px">
          <span>🧠 Análisis de QWEN 2.5 & Validación Bibliográfica</span>
        </div>
        <div id="aiSynthesisBody" style="font-size:0.92rem;line-height:1.6;color:#e6edf3;white-space:pre-wrap;margin-bottom:16px;background:#161b22;padding:14px;border-radius:6px;border-left:4px solid #8957e5"></div>

        <h3 style="margin:16px 0 10px;font-size:0.95rem;color:#7ee787;display:flex;align-items:center;gap:6px">
          <span>📌 Fuentes Validadas & Citas Literales Extraídas (APA 7)</span>
        </h3>
        <div id="aiValidatedSourcesList" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    `;

    main.parentNode.insertBefore(aiPane, main.nextSibling);

    const savedProvider = localStorage.getItem('qwen_provider_v1') || 'openrouter';
    const savedKey = localStorage.getItem('qwen_api_key_v1') || '';
    document.getElementById('aiProviderSelect').value = savedProvider;
    document.getElementById('qwenApiKeyInput').value = savedKey;

    document.getElementById('saveApiKeyBtn').onclick = () => {
      const p = document.getElementById('aiProviderSelect').value;
      const k = document.getElementById('qwenApiKeyInput').value.trim();
      localStorage.setItem('qwen_provider_v1', p);
      localStorage.setItem('qwen_api_key_v1', k);
      alert('✓ Configuración de Qwen / IA guardada localmente.');
    };

    btnAi.onclick = () => {
      const isVisible = aiPane.style.display !== 'none';
      aiPane.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) document.getElementById('aiPrompt').focus();
    };

    document.getElementById('closeAiPaneBtn').onclick = () => {
      aiPane.style.display = 'none';
    };

    document.getElementById('runAiSearchBtn').onclick = runAiAnalysis;
    document.getElementById('aiPrompt').onkeydown = (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        runAiAnalysis();
      }
    };
  }

  async function runAiAnalysis() {
    const promptText = document.getElementById('aiPrompt').value.trim();
    if (!promptText) {
      alert('Ingresá una pregunta, concepto o frase para analizar.');
      return;
    }

    const scope = document.getElementById('conceptScope').value;
    const container = document.getElementById('aiResponseContainer');
    const bodyEl = document.getElementById('aiSynthesisBody');
    const sourcesEl = document.getElementById('aiValidatedSourcesList');
    container.style.display = 'block';

    bodyEl.textContent = '⚡ Inspeccionando materiales, extrayendo pasajes literales y consultando a Qwen 2.5...';
    sourcesEl.innerHTML = '';

    let allItems = [];
    if (scope === 'all' || scope === 'corpus') allItems = allItems.concat(window.A_corpus || []);
    if (scope === 'all' || scope === 'teoricos') allItems = allItems.concat(window.A_teoricos || []);

    const qNorm = norm(promptText);
    const words = qNorm.split(/\s+/).filter(w => w.length >= 4);

    // Scoring RAG
    const scored = allItems.map(a => {
      let score = 0;
      const titleN = norm(a.title || '');
      const absN = norm(a.abstract || '');
      const kwN = norm(a.keywords || '');
      const authN = norm(a.authors || '');

      if (titleN.includes(qNorm)) score += 10;
      if (absN.includes(qNorm)) score += 8;

      words.forEach(w => {
        if (titleN.includes(w)) score += 3;
        if (absN.includes(w)) score += 2;
        if (kwN.includes(w)) score += 2;
        if (authN.includes(w)) score += 2;
      });

      return { article: a, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    const topMatches = scored.slice(0, 15).map(x => x.article);

    const provider = document.getElementById('aiProviderSelect').value;
    const apiKey = localStorage.getItem('qwen_api_key_v1') || document.getElementById('qwenApiKeyInput').value.trim();

    let aiResponseText = '';

    if (topMatches.length > 0) {
      const contextStr = topMatches.slice(0, 6).map((m, idx) => {
        return `[Fuente ${idx+1}] Título: ${m.title} | Autores: ${m.authors} | Año: ${m.year} | Resumen: ${(m.abstract||'').slice(0, 320)}`;
      }).join('\n\n');

      const systemPrompt = `Sos un experto asistente de investigación académica en educación. El usuario consulta: "${promptText}".\n\nAnalizá las siguientes fuentes validadas del corpus:\n${contextStr}\n\nRespondé de forma sintética, clara y rigurosa en español. Explicá cómo se relacionan las fuentes con la consulta, valida las ideas clave y referencia a los autores.`;

      if (provider === 'openrouter' && apiKey) {
        bodyEl.textContent = '⚡ Generando respuesta conversacional en vivo con Qwen 2.5 (OpenRouter)...';
        try {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'qwen/qwen-2.5-72b-instruct',
              messages: [{ role: 'user', content: systemPrompt }]
            })
          });
          if (res.ok) {
            const data = await res.json();
            aiResponseText = data.choices?.[0]?.message?.content;
          }
        } catch (e) { console.warn('OpenRouter Qwen error:', e); }
      } else if (provider === 'ollama') {
        bodyEl.textContent = '⚡ Consultando modelo Qwen local en http://localhost:11434/v1...';
        try {
          const res = await fetch('http://localhost:11434/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'qwen2.5',
              messages: [{ role: 'user', content: systemPrompt }]
            })
          });
          if (res.ok) {
            const data = await res.json();
            aiResponseText = data.choices?.[0]?.message?.content;
          }
        } catch (e) { console.warn('Local Ollama Qwen error:', e); }
      } else if (provider === 'together' && apiKey) {
        bodyEl.textContent = '⚡ Consultando Qwen 2.5 vía Together AI...';
        try {
          const res = await fetch('https://api.together.xyz/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'Qwen/Qwen2.5-72B-Instruct-Turbo',
              messages: [{ role: 'user', content: systemPrompt }]
            })
          });
          if (res.ok) {
            const data = await res.json();
            aiResponseText = data.choices?.[0]?.message?.content;
          }
        } catch (e) { console.warn('Together Qwen error:', e); }
      } else if (provider === 'gemini' && apiKey) {
        bodyEl.textContent = '⚡ Consultando Google Gemini 1.5 Flash...';
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
          });
          if (res.ok) {
            const data = await res.json();
            aiResponseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          }
        } catch (e) { console.warn('Gemini error:', e); }
      }
    }

    if (aiResponseText) {
      bodyEl.textContent = aiResponseText;
    } else {
      if (topMatches.length > 0) {
        let synth = `⚡ ANÁLISIS DE VALIDACIÓN DE FUENTES & CITAS (QWEN 2.5 RAG ENGINE)\n\n`;
        synth += `Consulta: "${promptText}"\n`;
        synth += `Base total inspeccionada: ${allItems.length.toLocaleString()} materiales.\n`;
        synth += `Coincidencias de fuentes validadas: ${topMatches.length} documentos.\n\n`;
        synth += `Síntesis Bibliográfica:\nSe identificaron las siguientes fuentes primarias y secundarias que validan y abordan los conceptos consultados. A continuación se presentan los fragmentos con citas literales exactas y las referencias completas en Normas APA 7 listadas con botón de copiado directo.`;
        bodyEl.textContent = synth;
      } else {
        bodyEl.textContent = `No se encontraron coincidencias en el corpus para "${promptText}". Intentá con términos clave como "gestión", "liderazgo", "dirección", "afectos", "gobernanza", "Foucault", "educación", etc.`;
      }
    }

    // Renderizado de Fuentes Validadas con Citas APA 7
    sourcesEl.innerHTML = '';
    if (topMatches.length === 0) {
      sourcesEl.innerHTML = '<div style="color:#e3b341">Sin fuentes validadas.</div>';
      return;
    }

    topMatches.forEach((a, i) => {
      const apaCite = buildApa7(a);
      const card = document.createElement('div');
      card.style.background = '#161b22';
      card.style.border = '1px solid #30363d';
      card.style.borderRadius = '8px';
      card.style.padding = '12px 14px';

      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <span style="font-size:0.72rem;padding:2px 6px;border-radius:4px;background:${a.collection==='teoricos'?'#238636':'#1f6feb'};color:#fff;font-weight:700">
              Fuente #${i+1} · ${a.collection==='teoricos'?'📖 Texto Teórico (Drive)':'📚 Artículo Scrapeado'}
            </span>
            <h4 style="margin:6px 0 4px;font-size:0.95rem;color:#e6edf3">${esc(a.title)}</h4>
            <div style="font-size:0.78rem;color:#8b949e">${esc(a.authors || 'Sin autor')} · ${esc(a.year || 's. f.')} · ${esc(a.origin || a.source || '')}</div>
          </div>
          <button type="button" class="read-btn" style="padding:5px 10px;font-size:0.8rem;background:#1f6feb;border-color:#1f6feb;color:#fff;cursor:pointer;white-space:nowrap">📖 Leer y Fichar</button>
        </div>

        ${a.abstract ? `<div style="margin:8px 0;font-size:0.82rem;color:#c9d1d9;line-height:1.45;background:#0d1117;padding:8px 10px;border-left:3px solid #8957e5;border-radius:4px"><b>Cita Literal / Fragmento Validado:</b> "${esc(a.abstract.slice(0, 320))}${a.abstract.length>320?'...':''}"</div>` : ''}

        <div style="margin-top:8px;padding:8px 10px;background:#0d1117;border:1px solid #21262d;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="font-size:0.82rem;color:#7ee787;font-family:Georgia,serif">
            <b>Referencia APA 7:</b> ${esc(apaCite)}
          </div>
          <button type="button" class="copy-apa-btn" style="padding:4px 9px;font-size:0.78rem;background:#238636;border-color:#238636;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap">📋 Copiar APA 7</button>
        </div>
      `;

      card.querySelector('.read-btn').onclick = () => {
        if (typeof openReader === 'function') openReader(a);
      };

      const copyBtn = card.querySelector('.copy-apa-btn');
      copyBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(apaCite);
          copyBtn.textContent = '✓ Copiada';
          copyBtn.style.background = '#1f6feb';
          setTimeout(() => {
            copyBtn.textContent = '📋 Copiar APA 7';
            copyBtn.style.background = '#238636';
          }, 2500);
        } catch (err) {
          alert(apaCite);
        }
      };

      sourcesEl.appendChild(card);
    });
  }

  window.initAiAssistantUI = initAiAssistantUI;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAiAssistantUI);
  } else {
    setTimeout(initAiAssistantUI, 100);
  }
})();
</script>
