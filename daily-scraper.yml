name: Daily Academic Scraper

on:
  schedule:
    # Ejecuta a las 13:00 UTC todos los días. Ajusta la hora según tu zona horaria.
    - cron: '0 13 * * *'
  workflow_dispatch:
    # Permite ejecutar el flujo manualmente desde la interfaz de GitHub
    inputs:
      reason:
        description: 'Motivo de la ejecución manual'
        required: false
        default: 'Ejecución manual'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python main.py
