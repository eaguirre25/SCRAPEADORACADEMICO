name: Análisis STM – Dirección Escolar

on:
  workflow_run:
    workflows: ["Extracción de corpus (PDFs → texto)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stm:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar R y dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            r-base \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Instalar paquetes de R
        run: |
          sudo Rscript -e "
            options(repos = c(CRAN = 'https://cloud.r-project.org'))
            install.packages(c(
              'stm', 'tm', 'SnowballC',
              'readr', 'dplyr', 'tidyr',
              'ggplot2', 'scales', 'stringr'
            ))
            cat('Paquetes OK\n')
          "

      - name: Crear directorio output
        run: mkdir -p output/plots

      - name: Ejecutar análisis STM
        run: sudo Rscript stm_analysis.R

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza análisis STM – $(date +'%Y-%m-%d')"
            git push
          fi
