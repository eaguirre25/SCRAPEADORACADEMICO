name: Análisis STM – Dirección Escolar

on:
  workflow_run:
    workflows: ["Extracción de corpus (PDFs → texto)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stm:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-topic-modeling.txt

      - name: Instalar dependencias Python del corpus
        run: pip install -r requirements-topic-modeling.txt

      - name: Instalar R y dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            r-base \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libuv1-dev

      - name: Instalar paquetes de R
        run: |
          sudo Rscript -e "
            options(repos = c(CRAN = 'https://cloud.r-project.org'))
            install.packages(c(
              'stm', 'tm', 'SnowballC',
              'readr', 'dplyr', 'tidyr',
              'ggplot2', 'scales', 'stringr',
              'yaml', 'jsonlite', 'digest', 'testthat'
            ))
            cat('Paquetes OK\n')
          "

      - name: Crear directorio output
        run: mkdir -p output/plots

      - name: Construir corpus canónicos auditables
        run: python scripts/build_modeling_corpus.py --config config/topic_modeling.yml

      - name: Ejecutar STM corregida y estabilidad por idioma
        run: python scripts/run_topic_pipeline.py --config config/topic_modeling.yml --mode stm --corpus-unit metadata --run-stability

      - name: Caché del modelo de embeddings
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-mpnet-base-v2

      # Los parámetros se vuelven a elegir sobre el corpus vigente con el
      # procedimiento declarado (cribado multicriterio + estabilidad en cinco
      # semillas), así el modelo reportado no hereda una selección hecha sobre
      # otro corpus.
      - name: Buscar parámetros BERTopic sobre el corpus vigente
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/search_bertopic_parameters.py --config config/topic_modeling.yml --corpus-unit metadata
          python scripts/run_bertopic_stability.py --config config/topic_modeling.yml --finalists-only

      # BERTopic general: se reajusta con el corpus vigente y los parámetros
      # recién seleccionados. Las etiquetas manuales de otra versión no se aplican.
      - name: Reajustar BERTopic con el corpus vigente
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/run_bertopic.py --config config/topic_modeling.yml --corpus-unit metadata \
            --use-selected-parameters --output-name metadata_multilingual/preferred_solution

      - name: Comparar STM y BERTopic
        run: python scripts/compare_topic_models.py --config config/topic_modeling.yml

      - name: Recalcular métricas de evaluación
        continue-on-error: true
        run: python scripts/evaluate_topic_models.py --config config/topic_modeling.yml

      - name: Pruebas R
        run: sudo Rscript -e "testthat::test_file('tests/testthat/test-stm-helpers.R')"

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza análisis STM y BERTopic – $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
