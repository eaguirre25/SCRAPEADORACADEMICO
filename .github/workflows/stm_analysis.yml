name: Análisis STM – Dirección Escolar

on:
  workflow_run:
    workflows: ["Extracción de corpus (PDFs → texto)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stm:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-topic-modeling.txt

      - name: Instalar dependencias Python del corpus
        run: pip install -r requirements-topic-modeling.txt

      - name: Instalar R y dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            r-base \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Instalar paquetes de R
        run: |
          sudo Rscript -e "
            options(repos = c(CRAN = 'https://cloud.r-project.org'))
            install.packages(c(
              'stm', 'tm', 'SnowballC',
              'readr', 'dplyr', 'tidyr',
              'ggplot2', 'scales', 'stringr',
              'yaml', 'jsonlite', 'digest', 'testthat'
            ))
            cat('Paquetes OK\n')
          "

      - name: Crear directorio output
        run: mkdir -p output/plots

      - name: Construir corpus canónicos auditables
        run: python scripts/build_modeling_corpus.py --config config/topic_modeling.yml

      - name: Ejecutar STM corregida y estabilidad por idioma
        run: python scripts/run_topic_pipeline.py --config config/topic_modeling.yml --mode stm --corpus-unit metadata --run-stability

      - name: Pruebas R
        run: sudo Rscript -e "testthat::test_file('tests/testthat/test-stm-helpers.R')"

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza análisis STM – $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
