name: Extracción de corpus (PDFs → texto)

on:
  push:
    branches: [main]
    paths:
      - 'generate_drive_manifest.R'
      - 'extract_corpus.R'
      - 'scripts/save_extracted_corpus.py'
      - '.github/workflows/extract_corpus (6).yml'
  workflow_run:
    workflows: ["Academic Scraper"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-corpus-main
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar R y pdftools desde apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base \
            r-cran-pdftools \
            r-cran-httr \
            r-cran-readr \
            r-cran-dplyr \
            libcurl4-openssl-dev \
            libssl-dev \
            libfontconfig1-dev

      - name: Instalar paquetes de R
        run: |
          sudo Rscript -e "
            library(httr)
            library(readr)
            library(dplyr)
            library(pdftools)
            cat('pdftools OK\n')
          "

      - name: Asegurar carpeta data
        run: mkdir -p data

      - name: Ejecutar extracción y actualizar manifiesto de Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          sudo -E env \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            GOOGLE_REFRESH_TOKEN="$GOOGLE_REFRESH_TOKEN" \
            DRIVE_FOLDER_ID="$DRIVE_FOLDER_ID" \
            Rscript extract_corpus.R
          sudo -E env \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            GOOGLE_REFRESH_TOKEN="$GOOGLE_REFRESH_TOKEN" \
            DRIVE_FOLDER_ID="$DRIVE_FOLDER_ID" \
            Rscript generate_drive_manifest.R

      - name: Guardar corpus y manifiesto en GitHub
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 scripts/save_extracted_corpus.py
