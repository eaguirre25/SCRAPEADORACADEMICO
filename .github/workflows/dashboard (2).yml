name: Generar Dashboard

on:
  workflow_run:
    workflows: ["Análisis STM – Dirección Escolar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  dashboard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Crear carpeta docs
        run: mkdir -p docs

      - name: Generar dashboard
        run: python generate_dashboard.py

      - name: Check dashboard and STM files
        run: python dashboard_healthcheck.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/dashboard_healthcheck.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza dashboard – $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
