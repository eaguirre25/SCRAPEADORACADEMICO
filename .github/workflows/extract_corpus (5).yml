name: Extracción de corpus (PDFs → texto)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar R y pdftools desde apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            r-base \
            r-cran-pdftools \
            libcurl4-openssl-dev \
            libssl-dev \
            libfontconfig1-dev

      - name: Instalar paquetes de R
        run: |
          sudo Rscript -e "
            options(repos = c(CRAN = 'https://cloud.r-project.org'))
            install.packages(c('googledrive', 'httr', 'readr', 'dplyr', 'jsonlite'))
            library(pdftools)
            cat('pdftools OK\n')
          "

      - name: Asegurar carpeta data
        run: mkdir -p data

      - name: Ejecutar extracción
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          sudo -E env \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            GOOGLE_REFRESH_TOKEN="$GOOGLE_REFRESH_TOKEN" \
            DRIVE_FOLDER_ID="$DRIVE_FOLDER_ID" \
            Rscript extract_corpus.R

      - name: Guardar corpus en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus.csv data/extraction_log.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en el corpus."
          else
            git commit -m "Actualiza corpus de texto extraído de PDFs"
            git push
          fi
