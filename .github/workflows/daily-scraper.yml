name: Academic Scraper
on:
  schedule:
    - cron: '0 13 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure output directories exist
        run: |
          mkdir -p data docs output

      - name: Run scraper
        run: |
          python main.py

      - name: Filter by academic relevance
        run: |
          python relevance_filter.py

      - name: Generate three-column dashboard
        run: |
          python generate_dashboard_three_columns.py

      - name: Check dashboard and STM files
        run: |
          python dashboard_healthcheck.py

      - name: Commit updated data and dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add \
            data/master_records.csv \
            data/review_records.csv \
            data/rejected_records.csv \
            data/latest_relevant_records.csv \
            data/relevance_filter_report.json \
            data/dashboard_healthcheck.json \
            data/seen_ids.json \
            data/publicaciones.xlsx \
            docs/index.html \
            docs/.nojekyll \
            relevance_filter.py \
            dashboard_healthcheck.py \
            generate_dashboard_three_columns.py \
            .github/workflows/daily-scraper.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update academic scraper database and dashboard"
            git push
          fi
