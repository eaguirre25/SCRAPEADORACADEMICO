name: Daily Academic Scraper
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure output directories exist
        run: |
          mkdir -p data docs

      - name: Run scraper
        run: |
          python main.py

      - name: Generate three-column dashboard
        run: |
          python generate_dashboard_three_columns.py

      - name: Commit updated data and dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/master_records.csv data/seen_ids.json data/publicaciones.xlsx docs/index.html docs/.nojekyll generate_dashboard_three_columns.py .github/workflows/daily-scraper.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update academic scraper database and dashboard"
            git push
          fi
