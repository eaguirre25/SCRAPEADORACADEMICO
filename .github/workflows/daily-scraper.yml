name: Academic Scraper
on:
  schedule:
    - cron: '0 13 */3 * *'
  workflow_dispatch:
    inputs:
      upload_after_date:
        description: 'Opcional: recuperar PDFs de registros validados posteriores a esta fecha (YYYY-MM-DD). Si queda vacío, sube solo novedades validadas.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure output directories exist
        run: |
          mkdir -p data docs output

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SKIP_PDF_UPLOAD: "true"
          SKIP_EMAIL: "true"
        run: |
          python main.py

      - name: Filter by academic relevance
        run: |
          python relevance_filter.py

      - name: Send curated email update
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python notify_updates.py

      - name: Upload validated PDFs to Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PDF_UPLOAD_AFTER_DATE: ${{ github.event.inputs.upload_after_date || '' }}
          UPLOAD_LATEST_RELEVANT_ONLY: "true"
          DRIVE_UPLOAD_STRICT: "false"
        run: |
          python upload_validated_pdfs.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add \
            data/master_records.csv \
            data/review_records.csv \
            data/rejected_records.csv \
            data/auto_review_promoted.csv \
            data/auto_review_rejected.csv \
            data/latest_relevant_records.csv \
            data/pdf_upload_report.json \
            data/relevance_filter_report.json \
            data/dashboard_healthcheck.json \
            data/seen_ids.json \
            data/publicaciones.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update academic scraper database"
            git push
          fi
