name: Extracción de corpus (PDFs → texto)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpoppler-cpp-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            poppler-utils
          dpkg -l | grep poppler

      - name: Instalar paquetes de R
        run: |
          Rscript -e "
            options(repos = c(CRAN = 'https://cloud.r-project.org'))
            install.packages('pdftools', type = 'source')
            install.packages(c('googledrive', 'httr', 'readr', 'dplyr'))
            library(pdftools)
            cat('pdftools instalado OK\n')
          "

      - name: Asegurar carpeta data
        run: mkdir -p data

      - name: Ejecutar extracción
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: Rscript extract_corpus.R

      - name: Guardar corpus en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus.csv data/extraction_log.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en el corpus."
          else
            git commit -m "Actualiza corpus de texto extraído de PDFs"
            git push
          fi
