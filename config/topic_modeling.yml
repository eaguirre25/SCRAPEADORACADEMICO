project:
  seed: 42
  start_year: 2020
  end_year: 2026

paths:
  corpus_pdf: data/corpus.csv
  bibliographic_records: data/master_records.csv
  output_root: output/topic_models
  cache_root: cache/topic_models
  human_labels: config/topic_labels.csv

corpus:
  canonical_unit: publication
  primary_modeling_unit: metadata
  fulltext_is_secondary: true
  remove_references: true
  detect_duplicates: true
  relevance_filter_required: true
  primary_unit: metadata
  fallback_unit: full_text
  minimum_characters: 200
  metadata_minimum_characters: 80
  deduplicate: true
  remove_references_from_full_text: true
  detect_language: true
  supported_languages: [es, en, pt, id]
  full_text_max_characters: 120000

text_fields:
  title: title
  abstract: abstract
  keywords: keywords
  full_text: texto

metadata_corpus:
  stm_strategy: unweighted
  alternatives: [unweighted, title_weighted, title_keywords_weighted]
  field_weights:
    title: 1
    keywords: 1
    abstract: 1

metadata_embeddings:
  combine_fields_as_embeddings: true
  title_weight: 0.35
  abstract_weight: 0.50
  keywords_weight: 0.15
  evaluate_title_abstract_only: true

fulltext_strategy:
  default: abstract_introduction_conclusions
  alternatives: [abstract_only, introduction_conclusions, fulltext_without_references]

relevance:
  clear_include_threshold: 0.60
  clear_exclude_threshold: -0.60
  semantic_enabled: true
  semantic_borderline_margin: 0.12
  validation_sample_size: 200
  manual_review_states: [borderline, manual_review]

multilingual:
  stm_strategy: separate_by_language
  bertopic_strategy: multilingual_embeddings
  harmonized_stm_enabled: false
  language_topic_diagnostic: true
  language_topic_threshold: 0.80
  stm_languages: [es, en, pt]
  indonesian_policy: bertopic_only

stm:
  enabled: true
  coarse_k: [8, 12, 16, 20, 24, 28, 32]
  fine_offsets: [-4, -2, 0, 2, 4]
  candidate_k: {start: 8, end: 32, step: 4}
  max_em_iterations: 500
  init_type: Spectral
  prevalence_formula: "~ s(anio)"
  number_of_runs: 5
  stability_runs: 5
  minimum_dominant_documents_warning: 10
  selection_requires_stability: true
  selection_requires_human_review: true
  missing_metric_policy: renormalize_and_warn
  remove_domain_stopwords: false
  diagnostic_weights:
    coherence: 0.30
    exclusivity: 0.25
    heldout: 0.20
    residual: 0.10
    stability: 0.15

bertopic:
  enabled: true
  embedding_model: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
  embedding_model_alternatives: [sentence-transformers/distiluse-base-multilingual-cased-v2]
  batch_size: 32
  min_topic_size: 10
  min_samples: 5
  nr_topics: null
  calculate_probabilities: true
  low_memory: true
  ngram_min: 1
  ngram_max: 3
  min_df: 2
  max_df: 0.95
  max_features: 50000
  reduce_frequent_words: true
  preserve_original_outliers: true
  reduce_outliers: false
  outlier_reduction_is_alternative: true
  parameter_search_enabled: true
  hierarchy_enabled: true
  language_dependence_diagnostic: true
  heterogeneous_topic_detection: true
  merge_candidate_similarity: 0.80
  umap:
    n_neighbors: 15
    n_components: 5
    min_dist: 0.0
    metric: cosine
  hdbscan:
    metric: euclidean
    cluster_selection_method: eom
    prediction_data: true
  parameter_search:
    umap_neighbors: [10, 15, 30]
    umap_components: [5, 10]
    umap_min_dist: [0.0, 0.1]
    min_cluster_size: [10, 20, 30, 50]
    min_samples: [5, 10]
    cluster_selection_method: [eom, leaf]
    staged_max_candidates: 12

validation:
  human_validation_required: true
  stability_runs: 5
  top_n_words: 15
  representative_documents: 10
  borderline_documents: 10
  low_confidence_documents: 10
  topic_intrusion_enabled: true
  word_intrusion_enabled: true
  minimum_topic_documents: 5
  ambiguous_probability_margin: 0.10
  trend_minimum_documents: 20
  bootstrap_samples: 500
